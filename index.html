<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Оперный Певец - Платформер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Georgia', serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: url('cur.png') 0 12, auto !important; }
  #menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 10;
  }
  #menu h1 { font-size: 64px; margin-bottom: 20px; color: #ffd700; text-shadow: 0 0 20px #ffd700; letter-spacing: 4px; }
  #menu p { font-size: 20px; margin-bottom: 40px; color: #ccc; }
  .voice-btn {
    display: flex; align-items: center; gap: 20px;
    padding: 20px 40px; margin: 10px; font-size: 24px;
    border: 2px solid #ffd700; background: rgba(255, 215, 0, 0.1);
    color: #fff; cursor: url('cur.png') 0 12, auto !important; border-radius: 10px;
    transition: all 0.3s; font-family: 'Georgia', serif; min-width: 400px;
    justify-content: space-between;
  }
  .voice-btn:hover { background: rgba(255, 215, 0, 0.3); transform: scale(1.05); box-shadow: 0 0 30px #ffd700; }
  .voice-btn .range { font-size: 16px; color: #ffd700; }
  .hint { margin-top: 30px; color: #888; font-size: 16px; text-align: center; max-width: 700px; }
  #hud {
    position: absolute; top: 20px; left: 20px; color: #fff;
    font-size: 18px; text-shadow: 1px 1px 3px #000; z-index: 5;
    pointer-events: none;
  }
  #hud .note-display {
    font-size: 48px; color: #ffd700; font-weight: bold;
    text-shadow: 0 0 20px currentColor;
  }
  #hud .bar {
    width: 200px; height: 10px; border: 1px solid #fff;
    margin-top: 10px; background: rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  #hud .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    transition: width 0.05s;
  }
  #hud .voice-info { margin-top: 5px; color: #ffd700; }

  /* Objective HUD */
  #objective {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    color: #fff; text-align: center; z-index: 5; pointer-events: none;
    text-shadow: 1px 1px 3px #000; min-width: 320px;
  }
  #objective .opera-name {
    color: #ffd700; font-size: 20px; letter-spacing: 1px;
  }
  #objective .opera-composer {
    color: #aaa; font-size: 13px; font-style: italic; margin-top: 2px;
  }
  #objective .stage-info {
    color: #ccc; font-size: 14px; margin-top: 6px;
    letter-spacing: 1px;
  }
  #objective .goal {
    font-size: 22px; margin-top: 8px; color: #ffd700;
    font-weight: bold;
  }
  #objective .goal .count { color: #fff; }
  #objective .goal.done { color: #2ecc71; }

  /* ===== МЕНЮ АРИЙ ===== */
  #ariaMenu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 5, 20, 0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 20; backdrop-filter: blur(4px);
  }
  #ariaMenu h2 { font-size: 42px; color: #ffd700; margin-bottom: 10px; text-shadow: 0 0 20px #ffd700; }
  #ariaMenu .subtitle { color: #aaa; font-size: 18px; margin-bottom: 30px; }
  .aria-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; max-width: 900px; width: 90%;
  }
  .aria-card {
    border: 2px solid #ffd700; border-radius: 12px;
    padding: 20px; background: rgba(255, 215, 0, 0.08);
    cursor: url('cur.png') 0 12, auto !important; transition: all 0.2s;
    display: flex; flex-direction: column; gap: 8px;
    position: relative; overflow: hidden;
  }
  .aria-card:hover:not(.disabled) {
    background: rgba(255, 215, 0, 0.22);
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
  }
  .aria-card.disabled { opacity: 0.4; cursor: not-allowed; border-color: #555; }
  .aria-card .aria-name { font-size: 22px; color: #ffd700; font-weight: bold; }
  .aria-card .aria-desc { font-size: 15px; color: #ddd; line-height: 1.4; }
  .aria-card .aria-cost {
    font-size: 18px; color: #ff8c00; margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
  }
  .aria-card .aria-cost .cd { font-size: 13px; color: #888; }
  .aria-card .aria-effect { font-size: 13px; color: #4fc3f7; font-style: italic; }
  #ariaMenu .close-hint { margin-top: 30px; color: #888; font-size: 16px; }

  /* Индикаторы активных эффектов */
  #effects {
    position: absolute; top: 20px; right: 20px; z-index: 6;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    pointer-events: none;
  }
  .effect-badge {
    background: rgba(0,0,0,0.6); border: 1px solid #ffd700;
    border-radius: 20px; padding: 6px 14px;
    color: #ffd700; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 5px rgba(255,215,0,0.4); }
    to   { box-shadow: 0 0 18px rgba(255,215,0,0.9); }
  }

  /* ===== ОВЕРЛЕЙ ===== */
  #overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, rgba(20,10,40,0.92), rgba(0,0,0,0.97));
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 40; text-align: center; padding: 40px;
  }
  #overlay h2 {
    font-size: 64px; color: #ffd700; text-shadow: 0 0 30px #ffd700;
    margin-bottom: 20px; letter-spacing: 4px;
  }
  #overlay h3 {
    font-size: 32px; color: #ff8c00; margin: 10px 0 20px 0;
    font-style: italic;
  }
  #overlay p {
    font-size: 20px; color: #ccc; margin: 8px 0; max-width: 700px;
    line-height: 1.5;
  }
  #overlay .stats {
    margin-top: 20px; font-size: 22px; color: #4fc3f7;
  }
  #overlay button {
    margin-top: 40px; padding: 18px 50px; font-size: 24px;
    border: 2px solid #ffd700; background: rgba(255,215,0,0.15);
    color: #ffd700; border-radius: 12px; cursor: url('cur.png') 0 12, auto !important;
    font-family: 'Georgia', serif; transition: all 0.3s; letter-spacing: 2px;
  }
  #overlay button:hover {
    background: rgba(255,215,0,0.35); box-shadow: 0 0 40px #ffd700;
    transform: scale(1.05);
  }
  #overlay .emoji { font-size: 90px; margin-bottom: 10px; }
body{ cursor: url('cur.png') 0 12, auto !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" style="display:none">
  <div class="note-display" id="noteDisplay">C3</div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  <div class="voice-info" id="voiceInfo">Тенор</div>
  <div id="health" style="margin-top:8px; font-size:22px;"></div>
  <div id="score" style="margin-top:4px; font-size:30px; color:#ccc;">𝄞0</div>
</div>
<div id="objective"></div>
<div id="effects"></div>

<div id="menu">
  <h1>ОПЕРНЫЙ ПЕВЕЦ</h1>
  <p>Выберите тип голоса</p>
  <button class="voice-btn" data-voice="tenor">
    <span>🎭 Тенор</span><span class="range">C3 – C5</span>
  </button>
  <button class="voice-btn" data-voice="bass">
    <span>🎭 Бас</span><span class="range">E2 – E4</span>
  </button>
  <button class="voice-btn" data-voice="baritone">
    <span>🎭 Баритон</span><span class="range">A2 – A4</span>
  </button>
  <p class="hint">← → или A/D — движение &nbsp;|&nbsp; SPACE — прыжок &nbsp;|&nbsp; Удерживайте ENTER — набор высоты голоса, отпустите — выстрел нотой &nbsp;|&nbsp; Собирайте ♪ и ♫ &nbsp;|&nbsp; КЛИК по персонажу — меню арий</p>
</div>

<div id="ariaMenu">
  <h2 id="ariaMenuTitle">Арии</h2>
  <div class="subtitle" id="ariaMenuSubtitle">Выберите арию</div>
  <div class="aria-grid" id="ariaGrid"></div>
  <div class="close-hint">Нажмите ESC или кликните по фону, чтобы закрыть</div>
</div>

<div id="overlay"></div>

<script>

function gameOver() {
  gameState.stageComplete = true;   // останавливает update
  gameState.paused = true;
  const opera = OPERAS[gameState.currentOperaIdx];
  const stage = gameState.stageDef;
  const isBoss = stage.type === 'boss';
  showOverlay({
    emoji: isBoss ? '💀' : '☠️',
    title: 'ПОРАЖЕНИЕ',
    sub: isBoss
      ? `«${opera.bossName}» оказался сильнее...`
      : `Вы пали на этапе ${gameState.currentStageIdx + 1}`,
    info: `Опера: «${opera.name}» — ${opera.composer}`,
    btn: 'НАЧАТЬ ЗАНОВО',
    onClick: () => { hideOverlay(); location.reload(); }
  });
}

let audioCtx = null;

async function loadBassSample() {
  if (!BASS_SAMPLE_B64) { bassSampleLoaded = false; return; }
  try {
    if (!audioCtx) initAudio();
    const bin = atob(BASS_SAMPLE_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    bassSampleBuffer = await audioCtx.decodeAudioData(bytes.buffer);
    bassSampleLoaded = true;
  } catch (e) { console.warn('bass decode failed:', e); bassSampleLoaded = false; }
}

  if (!BARITONE_SAMPLE_B64) { baritoneSampleLoaded = false; return; }

    if (!audioCtx) initAudio();

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(audioCtx.destination);

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 20;
    comp.ratio.value = 4;
    comp.attack.value = 0.005;
    comp.release.value = 0.2;
    comp.connect(masterGain);
    masterGain._comp = comp;

    const convolver = audioCtx.createConvolver();
    const len = audioCtx.sampleRate * 2.2;
    const impulse = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.2);
    }
    convolver.buffer = impulse;
    reverbSend = audioCtx.createGain();
    reverbSend.gain.value = 0.35;
    const wetGain = audioCtx.createGain();
    wetGain.gain.value = 0.45;
    reverbSend.connect(convolver);
    convolver.connect(wetGain);
    wetGain.connect(comp);
    reverbNode = convolver;

    const preDelay = audioCtx.createDelay(0.2);
    preDelay.delayTime.value = 0.028;
    const operaConvolver = audioCtx.createConvolver();
    const operaLen = Math.floor(audioCtx.sampleRate * 3.8);
    const operaImpulse = audioCtx.createBuffer(2, operaLen, audioCtx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = operaImpulse.getChannelData(ch);
      for (let i = 0; i < operaLen; i++) {
        const t = i / operaLen;
        const decay = Math.pow(1 - t, 2.8);
        const mod = 1 + 0.15 * Math.sin(i * 0.0007);
        d[i] = (Math.random()*2-1) * decay * mod;
      }
      const reflections = [0.012, 0.021, 0.033, 0.048, 0.067, 0.089];
      for (const rt of reflections) {
        const idx = Math.floor(rt * audioCtx.sampleRate);
        if (idx < operaLen) d[idx] += (Math.random()*2-1) * 0.6;
      }
    }
    operaConvolver.buffer = operaImpulse;
    const operaWet = audioCtx.createGain();
    operaWet.gain.value = 0.55;
    const operaEQ = audioCtx.createBiquadFilter();
    operaEQ.type = 'highpass';
    operaEQ.frequency.value = 180;
    const operaLP = audioCtx.createBiquadFilter();
    operaLP.type = 'lowpass';
    operaLP.frequency.value = 5500;

    window._operaReverbSend = audioCtx.createGain();
    window._operaReverbSend.gain.value = 1.0;
    window._operaReverbSend.connect(preDelay);
    preDelay.connect(operaConvolver);
    operaConvolver.connect(operaWet);
    operaWet.connect(operaEQ);
    operaEQ.connect(operaLP);
    operaLP.connect(comp);
  } catch (e) { console.warn('Audio init failed:', e); }
}

function unlockAudio() {
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (!tenorSampleLoaded && !tenorSampleBuffer) loadTenorSample();
  if (!bassSampleLoaded && !bassSampleBuffer) loadBassSample();
  if (!baritoneSampleLoaded && !baritoneSampleBuffer) loadBaritoneSample();
}
window.addEventListener('pointerdown', unlockAudio, { once: false });
window.addEventListener('keydown', unlockAudio, { once: false });

function midiToFreq(m) { return 440 * Math.pow(2, (m - 69) / 12); }

let glottalWave = null;
function makeGlottalWave(ctx) {
  const n = 40;
  const real = new Float32Array(n);
  const imag = new Float32Array(n);
  for (let i = 1; i < n; i++) imag[i] = 1 / Math.pow(i, 1.2);
  return ctx.createPeriodicWave(real, imag, { disableNormalization: false });
}

function playBassSample(midi, velocity = 1.0) {
  if (!bassSampleLoaded || !bassSampleBuffer || !audioCtx) return;
  if (audioCtx.state !== 'running') return;
  const now = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = bassSampleBuffer;
  const rate = Math.pow(2, (midi - BASS_SAMPLE_ROOT) / 12);
  src.playbackRate.value = rate;
  const bass = VOICE_TYPES.bass;
  const tNorm = Math.max(0, Math.min(1, (midi - bass.minMidi) / (bass.maxMidi - bass.minMidi)));
  const TARGET_DUR = 0.6 + Math.pow(tNorm, 1.4) * 1.0;
  const playDur = Math.min(TARGET_DUR, bassSampleBuffer.duration / rate);
  const env = audioCtx.createGain();
  const gainMod = bass.gainCurve(tNorm);
  const peak = Math.min(1, (0.35 + velocity * 0.65) * gainMod);
  const release = Math.min(0.35, playDur * 0.35);
  env.gain.setValueAtTime(0, now);
  env.gain.linearRampToValueAtTime(peak, now + 0.012);
  env.gain.setValueAtTime(peak, now + playDur - release);
  env.gain.linearRampToValueAtTime(0.0001, now + playDur);
  const tone = audioCtx.createBiquadFilter();
  tone.type = 'highshelf';
  tone.frequency.value = 3500;
  tone.gain.value = -4 - tNorm * 10;
  src.connect(env);
  env.connect(tone);
  tone.connect(masterGain._comp);
  if (reverbSend) tone.connect(reverbSend);
  src.start(now);
  src.stop(now + playDur + 0.05);
}

function playBaritoneSample(midi, velocity = 1.0) {

  const playDur = Math.min(TARGET_DUR, baritoneSampleBuffer.duration / rate);
  const env = audioCtx.createGain();
  const gainMod = bar.gainCurve(tNorm);

function playTenorSample(midi, velocity = 1.0) {

  const TARGET_DUR = 0.7 + Math.pow(tNorm, 1.4) * 1.1;

  const gainMod = tenor.gainCurve(tNorm);

  env.gain.setValueAtTime(0, now);

function playVocal(midi, voiceKey, velocity = 1.0) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  if (!glottalWave) glottalWave = makeGlottalWave(audioCtx);
  const T = VOICE_TIMBRE[voiceKey] || VOICE_TIMBRE.tenor;
  const baseFreq = midiToFreq(midi + T.register);
  const now = audioCtx.currentTime;
  const v = VOICE_TYPES[voiceKey];
  const tNorm = Math.max(0, Math.min(1, (midi - v.minMidi) / (v.maxMidi - v.minMidi)));
  const baseDur = 0.45 + Math.pow(tNorm, 1.3) * 0.95;
  const duration = baseDur * (0.95 + Math.random() * 0.1);
  const release = T.release * (0.8 + tNorm * 0.5);
  const osc = audioCtx.createOscillator();
  osc.setPeriodicWave(glottalWave);
  osc.frequency.value = baseFreq;
  const jitterLfo = audioCtx.createOscillator();
  jitterLfo.type = 'sine'; jitterLfo.frequency.value = 11 + Math.random() * 4;
  const jitterGain = audioCtx.createGain();
  jitterGain.gain.value = baseFreq * T.jitter;
  jitterLfo.connect(jitterGain); jitterGain.connect(osc.frequency);
  const vibLfo = audioCtx.createOscillator();
  vibLfo.type = 'sine'; vibLfo.frequency.value = T.vibratoRate;
  const vibGain = audioCtx.createGain();
  vibGain.gain.setValueAtTime(0, now);
  vibGain.gain.linearRampToValueAtTime(T.vibratoDepth, now + 0.25);
  vibGain.gain.linearRampToValueAtTime(T.vibratoDepth * 0.9, now + duration);
  vibLfo.connect(vibGain); vibGain.connect(osc.frequency);
  const shimmerLfo = audioCtx.createOscillator();
  shimmerLfo.type = 'sine'; shimmerLfo.frequency.value = 7 + Math.random() * 3;
  const shimmerGain = audioCtx.createGain();
  shimmerGain.gain.value = T.shimmer;
  shimmerLfo.connect(shimmerGain);
  const srcGain = audioCtx.createGain();
  srcGain.gain.value = 1.0;
  osc.connect(srcGain);
  shimmerGain.connect(srcGain.gain);
  const mixGain = audioCtx.createGain();
  mixGain.gain.value = 0;
  for (const fmt of T.formants) {
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = fmt.f; bp.Q.value = fmt.q;
    const g = audioCtx.createGain(); g.gain.value = fmt.g;
    srcGain.connect(bp); bp.connect(g); g.connect(mixGain);
  }
  const noiseLen = audioCtx.sampleRate * Math.max(0.25, duration * 0.5);
  const noiseBuf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < noiseLen; i++) nd[i] = (Math.random()*2-1) * Math.pow(1 - i/noiseLen, 1.5);
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuf;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = T.breath * velocity * (0.8 + tNorm * 0.6);
  const noiseHP = audioCtx.createBiquadFilter();
  noiseHP.type = 'highpass'; noiseHP.frequency.value = 1500;
  noise.connect(noiseHP); noiseHP.connect(noiseGain); noiseGain.connect(mixGain);
  const gainMod = v.gainCurve(tNorm);
  const peak = Math.min(1, (0.45 + velocity * 0.55) * gainMod);
  const attack = T.attack * (1 + tNorm * 0.4);
  mixGain.gain.setValueAtTime(0, now);
  mixGain.gain.linearRampToValueAtTime(peak, now + attack);
  mixGain.gain.linearRampToValueAtTime(peak * 0.85, now + attack + 0.25);
  mixGain.gain.setValueAtTime(peak * 0.85, now + duration);
  mixGain.gain.exponentialRampToValueAtTime(0.0008, now + duration + release);
  const tone = audioCtx.createBiquadFilter();
  tone.type = 'lowshelf'; tone.frequency.value = 400;
  tone.gain.value = (T.brightness - 0.5) * 12;
  const toneHP = audioCtx.createBiquadFilter();
  toneHP.type = 'highshelf'; toneHP.frequency.value = 3000;
  toneHP.gain.value = (T.brightness - 0.5) * 10 + tNorm * 3;
  const outGain = audioCtx.createGain();
  outGain.gain.value = 1.0;
  mixGain.connect(tone); tone.connect(toneHP); toneHP.connect(outGain);
  outGain.connect(masterGain._comp);
  if (reverbSend) outGain.connect(reverbSend);
  osc.start(now); jitterLfo.start(now); vibLfo.start(now); shimmerLfo.start(now); noise.start(now);
  const stopAt = now + duration + release + 0.1;
  osc.stop(stopAt); jitterLfo.stop(stopAt); vibLfo.stop(stopAt);
  shimmerLfo.stop(stopAt); noise.stop(stopAt);
}

const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToName(m) {
  const octave = Math.floor(m / 12) - 1;
  return NOTE_NAMES[((m % 12) + 12) % 12] + octave;
}
const VOICE_TYPES = {
  tenor: {
    name:'Тенор', minMidi:48, maxMidi:72,
    colors:{top:'#ffd700',mid:'#ff8c00',low:'#8b4513'},
    damageBase:1.6, damageCurve:t=>0.4+t*1.6, damageDesc:'Высокий голос',
    gainCurve: t => {
      if (t > 0.4) return 0.7 + ((t - 0.4) / 0.6) * 0.3;
      const x = (0.4 - t) / 0.4;
      return 0.7 * Math.pow(1 - x, 2.5) + 0.02;
    }
  },
  bass: {
    name:'Бас', minMidi:40, maxMidi:64,
    colors:{top:'#8b4513',mid:'#ff8c00',low:'#ffd700'},
    damageBase:1.0, damageCurve:t=>2.0-t*1.6, damageDesc:'Низкий голос',
    gainCurve: t => {
      if (t < 0.6) return 1.0 - (t / 0.6) * 0.3;
      const x = (t - 0.6) / 0.4;
      return 0.7 * Math.pow(1 - x, 2.5) + 0.02;
    }
  },
  baritone: {
    name:'Баритон', minMidi:45, maxMidi:69,
    colors:{top:'#c0392b',mid:'#ffd700',low:'#ff8c00'},
    damageBase:1.3, damageCurve:t=>0.6+1.4*(1-Math.abs(t-0.5)*2), damageDesc:'Средний голос',
    gainCurve: t => {
      const peak = 0.4;
      if (t <= peak) return 0.55 + 0.45 * (t / peak);
      const x = (t - peak) / (1 - peak);
      return 0.12 + 0.88 * Math.pow(1 - x, 1.6);
    }
  }
};

function getStagesForOpera(idx) {
  const opera = OPERAS[idx];
  // Масштабирование целей от индекса оперы (чем дальше — тем больше)
  const scale = 1 + idx * 0.03;
  return opera.stages.map((st, i) => {
    const target = st.target ? Math.round(st.target * scale) : 0;
    // Ширина этапа: боссы короче, обычные этапы — длиннее
    let width;
    if (st.type === 'boss') width = 2400 + idx * 40;
    else width = (3800 + i * 400) * (1 + idx * 0.02);
    return {
      type: st.type,
      target,
      width: Math.round(width),
      desc: st.target
        ? `${st.desc} (${target})`
        : st.desc
    };
  });
}
function getStagesForOpera(idx) {
  const opera = OPERAS[idx];
  // ширина этапа и множители — можно масштабировать по индексу
  const scale = 1 + idx * 0.03;
  return opera.stages.map((st, i) => {
    const target = st.target ? Math.round(st.target * scale) : 0;
    return {
      type: st.type,
      target,
      width: st.type === 'boss' ? 2400 : (3800 + i * 400) * scale,
      desc: st.target
        ? st.desc + ` (${target})`
        : st.desc
    };
  });

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAriaMenu(); return; }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && gameState.voice && !gameState.charging
      && gameState.health > 0 && !gameState.paused
      && !gameState.stageComplete && !gameState.gameComplete) {
    gameState.charging = true;
  }
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === 'Enter' && gameState.charging && gameState.voice) {
    fireNote();
    gameState.charging = false;
  }
});

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const p = gameState.player;
  const sx = p.x - gameState.camera.x;
  if (mx > sx && mx < sx + p.w && my > p.y && my < p.y + p.h) openAriaMenu();
});

function renderAriaMenu() {
  const v = gameState.voice, key = gameState.voiceKey;
  ariaTitleEl.textContent = '🎭 Арии — ' + v.name;
  ariaSubtitleEl.textContent = 'Очки: 𝄞' + gameState.score + '  •  Кликните по арии';
  ariaGridEl.innerHTML = '';
  (ARIAS[key] || []).forEach(aria => {
    const cd = gameState.ariaCooldowns[aria.id] || 0;
    const canAfford = gameState.score >= aria.cost;
    const onCooldown = cd > 0;
    const disabled = !canAfford || onCooldown;
    const card = document.createElement('div');
    card.className = 'aria-card' + (disabled ? ' disabled' : '');
    card.innerHTML = `
      <div class="aria-name">${aria.icon} ${aria.name}</div>
      <div class="aria-desc">${aria.desc}</div>
      <div class="aria-effect">Эффект: ${describeEffect(aria)}</div>
      <div class="aria-cost">
        <span>𝄞 ${aria.cost}</span>
        <span class="cd">${onCooldown ? '⏱ ' + cd.toFixed(1) + 'с' : (aria.cooldown ? 'КД ' + aria.cooldown + 'с' : '')}</span>
      </div>`;
    if (!disabled) card.addEventListener('click', () => activateAria(aria));
    ariaGridEl.appendChild(card);
  });
}
function describeEffect(a) {
  return ({
    freeze:'Заморозка ('+a.duration+'с)', heal:'Восстановление', volley:'Залп 5 нот',
    slow:'Замедление ('+a.duration+'с)', invuln:'Неуязвимость ('+a.duration+'с)',
    shield:'Щит (1 удар)', explosion:'Взрыв врагов', killAll:'Уничтожить всех',
    doubleJump:'Двойной прыжок ('+a.duration+'с)', magnet:'Притягивание нот',
    push:'Отталкивание врагов', rage:'x2 урон ('+a.duration+'с)'
  })[a.effect] || '';
}
function activateAria(aria) {
  if (gameState.score < aria.cost) return;
  if ((gameState.ariaCooldowns[aria.id] || 0) > 0) return;

function rectsOverlap(a, b, pad = 0) {
  return !(a.x + a.w + pad <= b.x || b.x + b.w + pad <= a.x
        || a.y + a.h + pad <= b.y || b.y + b.h + pad <= a.y);

const PLAT_MIN_W = 120, PLAT_MAX_W = 280, PLAT_H = 25;
const JUMP_H_REACH = 300, JUMP_UP_REACH = 100, JUMP_DOWN_REACH = 240;
function canReach(from, to) {
  const fromRight = from.x + from.w, toRight = to.x + to.w;
  const gap = Math.max(0, Math.max(from.x - toRight, to.x - fromRight));
  if (gap > JUMP_H_REACH) return false;
  const dy = to.y - from.y;
  const horizRatio = gap / JUMP_H_REACH;
  const maxUp = JUMP_UP_REACH * (1 - horizRatio * 0.6);
  if (dy < -maxUp) return false;
  if (dy > JUMP_DOWN_REACH) return false;
  return true;
}
function generatePlatformsUpTo(targetX) {
  const groundY = gameState.groundY;
  const limitX = gameState.stageWidth;
  const target = Math.min(targetX, limitX);

  while (gameState.generatedUpToX < target) {
    const last = gameState.lastPlatform;
    let placed = false, attempts = 0;
    while (!placed && attempts < 40) {
      attempts++;
      const w = PLAT_MIN_W + Math.random() * (PLAT_MAX_W - PLAT_MIN_W);
      const minGap = 70, maxGap = 220;
      const x = last.x + last.w + minGap + Math.random() * (maxGap - minGap);
      if (x + w > limitX) break;
      const roll = Math.random();
      let dy;
      if (roll < 0.35) dy = -(30 + Math.random() * 60);
      else if (roll < 0.60) dy = (30 + Math.random() * 70);
      else dy = (Math.random() - 0.5) * 50;
      let y = last.y + dy;
const minY = Math.max(80, groundY - 520);  maxY = groundY - 90;
      y = Math.max(minY, Math.min(maxY, y));
      const candidate = { x, y, w, h:PLAT_H, theme: themeAt(x) };
      if (!canReach(last, candidate)) continue;
      let overlaps = false;
      for (const p of gameState.platforms) {
        if (p.isGround) continue;
        if (rectsOverlap(candidate, p, 30)) { overlaps = true; break; }
      }
      if (overlaps) continue;
      gameState.platforms.push(candidate);
      gameState.lastPlatform = candidate;
      gameState.generatedUpToX = candidate.x + candidate.w;
      placed = true;
    }
    if (!placed) {
      const x = Math.min(last.x + last.w + 100, limitX - 180);
      if (x + 180 > limitX) break;
      const y = Math.max(groundY - 520, Math.min(groundY - 90, last.y - 50 + Math.random()*100));
      const candidate = { x, y, w:180, h:PLAT_H, theme: themeAt(x) };
      gameState.platforms.push(candidate);
      gameState.lastPlatform = candidate;
      gameState.generatedUpToX = candidate.x + candidate.w;
    }
  }
}

function placeEnemies(count) {
  const candidates = gameState.platforms.filter(p => !p.isGround && p.w > 150 && p.x > 500);
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  const diff = Math.min(1, gameState.currentOperaIdx / 20);
  let placed = 0;
  for (const c of candidates) {
    if (placed >= count) break;
    const ew = 44, eh = 60;
    const ex = c.x + 20 + Math.random() * Math.max(0, c.w - ew - 40);
    const ey = c.y - eh;
    const hp = 80 + diff * 140;
    gameState.enemies.push({
      x:ex, y:ey, vx:(Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.3 + diff * 0.8),
      vy:0, w:ew, h:eh, alive:true, hitFlash:0,
      hp, maxHp:hp,
      patrolMinX: c.x + 8, patrolMaxX: c.x + c.w - ew - 8,
      wobble: Math.random() * Math.PI * 2

    placed++;
  }
}

function placeNotes(count) {
  const candidates = gameState.platforms.filter(p => !p.isGround && p.x > 300);
  let placed = 0;
  for (const c of candidates) {
    if (placed >= count) break;
    gameState.collectibleNotes.push({
      x: c.x + c.w / 2, y: c.y - 35,
      type: Math.random() < 0.75 ? 'single' : 'double',
      collected:false, bob: Math.random() * Math.PI * 2
    });
    placed++;
  }
  while (placed < count) {
    const x = 400 + Math.random() * (gameState.stageWidth - 800);
    gameState.collectibleNotes.push({
      x, y: gameState.groundY - 50,
      type: Math.random() < 0.75 ? 'single' : 'double',
      collected:false, bob: Math.random() * Math.PI * 2
    });
    placed++;
  }
}

function startGame(voiceKey) {

  gameState.voiceKey = voiceKey;
  document.getElementById('menu').style.display = 'none';

  document.getElementById('voiceInfo').textContent = gameState.voice.name + ' — ' + gameState.voice.damageDesc;

function startStage(operaIdx, stageIdx) {
  gameState.currentOperaIdx = operaIdx;
  gameState.currentStageIdx = stageIdx;
  const opera = OPERAS[operaIdx];
  const stages = getStagesForOpera(operaIdx);
  const stage = stages[stageIdx];
  gameState.stageDef = stage;
  gameState.stageWidth = stage.width;

  gameState.enemiesTotal = 0;
  gameState.enemiesKilled = 0;
  gameState.notesNeeded = 0;
  gameState.notesCollected = 0;
  gameState.boss = null;
  gameState.stageComplete = false;
  gameState.pendingAdvance = null;

  gameState.platforms = [];
  gameState.collectibleNotes = [];
  gameState.enemies = [];
  gameState.notes = [];
  gameState.particles = [];
  gameState.camera.x = 0;
  gameState.time = 0;
  gameState.effects = { frozen:0, invuln:0, shield:0, slow:0, doubleJump:0, rage:0, jumpsLeft:0 };
  gameState.activeEffects = [];
  gameState.invulnTimer = 1.0;

  const groundTiles = Math.ceil(stage.width / 400) + 2;
  for (let i = 0; i < groundTiles; i++) {
    gameState.platforms.push({ x:i*400, y:gameState.groundY, w:400, h:200, isGround:true });
  }
  const startPlat = { x:260, y:gameState.groundY - 140, w:200, h:PLAT_H, theme:themeAt(260) };
  gameState.platforms.push(startPlat);
  gameState.lastPlatform = startPlat;
  gameState.generatedUpToX = startPlat.x + startPlat.w;
  gameState.lastEnemyX = 0;

  generatePlatformsUpTo(stage.width);

  const p = gameState.player;
  p.x = 100; p.y = gameState.groundY - 120;
  p.vx = 0; p.vy = 0; p.facing = 1;

  if (stage.type === 'kill') {
    placeEnemies(stage.target);
    gameState.enemiesTotal = stage.target;
  } else if (stage.type === 'collect') {
    placeNotes(stage.target);
    gameState.notesNeeded = stage.target;
  } else if (stage.type === 'boss') {
    spawnBoss(opera);
  }

  updateObjectiveHUD();
}

function updateObjectiveHUD() {
  const opera = OPERAS[gameState.currentOperaIdx];
  const stage = gameState.stageDef;
  const el = document.getElementById('objective');
  if (!el) return;
  const progress = stage.type === 'kill'
    ? `${gameState.enemiesKilled} / ${gameState.enemiesTotal}`
    : stage.type === 'collect'
    ? `${gameState.notesCollected} / ${gameState.notesNeeded}`
    : 'БОСС';
  const done = (stage.type === 'kill' && gameState.enemiesKilled >= gameState.enemiesTotal)
    || (stage.type === 'collect' && gameState.notesCollected >= gameState.notesNeeded)
    || (stage.type === 'boss' && gameState.boss && gameState.boss.hp <= 0);
  el.innerHTML = `
    <div class="opera-name">🎭 ${opera.name}</div>
    <div class="opera-composer">${opera.composer}</div>
    <div class="stage-info">Этап ${gameState.currentStageIdx + 1}/3 — ${stage.desc}</div>
    <div class="goal ${done ? 'done' : ''}">
      ${done ? '✔ ГОТОВО' : '◈ Прогресс'} <span class="count">${progress}</span>
    </div>`;
}

function checkStageComplete() {
  if (gameState.stageComplete) return;
  if (gameState.health <= 0) return;
  const stage = gameState.stageDef;
  let done = false;
  if (stage.type === 'kill' && gameState.enemiesKilled >= gameState.enemiesTotal) done = true;
  else if (stage.type === 'collect' && gameState.notesCollected >= gameState.notesNeeded) done = true;
  else if (stage.type === 'boss' && gameState.boss && gameState.boss.hp <= 0) done = true;
  if (done) completeStage();
}

function fireNote() {
  const v = gameState.voice;
  const range = v.maxMidi - v.minMidi;
  const midi = v.minMidi + Math.round(gameState.chargeValue * range);
  const noteName = midiToName(midi);
  const p = gameState.player;
  const dir = p.facing;
  const t = gameState.chargeValue;

  if (p.voiceKey === 'tenor') playTenorSample(midi, t);
  else if (p.voiceKey === 'bass') playBassSample(midi, t);
  else if (p.voiceKey === 'baritone') playBaritoneSample(midi, t);
  else playVocal(midi, p.voiceKey, t);

  let color;
  if (t < 0.5) color = lerpColor(v.colors.low, v.colors.mid, t * 2);
  else color = lerpColor(v.colors.mid, v.colors.top, (t - 0.5) * 2);

  let damage = v.damageBase * v.damageCurve(t) * 20;
  if (gameState.effects.rage > 0) damage *= 2;

  gameState.notes.push({
    x: p.x + p.w/2 + dir*30, y: p.y + p.h*0.4,
    vx: dir * (8 + t * 8), vy: -2 - t * 3,
    life:1, maxLife:1, color, noteName,
    size: 20 + t * 25, rot:0, rotSpeed:(Math.random()-0.5)*0.1,
    t, damage
  });

  for (let i = 0; i < 8; i++) {
    gameState.particles.push({
      x: p.x + p.w/2 + dir*30, y: p.y + p.h*0.4,
      vx: dir * (2 + Math.random()*5), vy: (Math.random()-0.5)*6,
      life:0.6, maxLife:0.6, color, size: 3 + Math.random()*4
    });
  }
  gameState.score++;
  gameState.chargeValue = 0;
  gameState.chargeDirection = 1;
}
function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

function drawSinger(p, singing, chargeT) {

  ctx.save();

  const headBob = singing ? Math.sin(gameState.time * 20) * 2 : 0;

  ctx.fillStyle = '#0a0a0a';

const GRAVITY = 0.8, MOVE_SPEED = 6, JUMP_POWER = -16;

function update(dt) {
  if (gameState.paused) return;
  if (gameState.stageComplete) return;

  const timeScale = gameState.effects.slow > 0 ? 0.4 : 1;
  const effectiveDt = dt * timeScale;
  gameState.time += effectiveDt;
  const p = gameState.player;
  if (!p) return;

  if (keys['arrowleft'] || keys['a'] || keys['ф']) { p.vx = -MOVE_SPEED; p.facing = -1; }
  else if (keys['arrowright'] || keys['d'] || keys['в']) { p.vx = MOVE_SPEED; p.facing = 1; }
  else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }

  const jumpPressed = keys[' '] || keys['arrowup'] || keys['w'] || keys['ц'];
  if (jumpPressed && p.onGround) {
    p.vy = JUMP_POWER; p.onGround = false;
    gameState.effects.jumpsLeft = gameState.effects.doubleJump > 0 ? 1 : 0;
  } else if (jumpPressed && !p.onGround && gameState.effects.doubleJump > 0
             && gameState.effects.jumpsLeft > 0 && !p._jumpHeld) {
    p.vy = JUMP_POWER * 0.85;
    gameState.effects.jumpsLeft--;
    p._jumpHeld = true;
    for (let i = 0; i < 8; i++) {
      gameState.particles.push({
        x: p.x+p.w/2, y: p.y+p.h,
        vx:(Math.random()-0.5)*4, vy:Math.random()*3,
        life:0.5, maxLife:0.5, color:'#ffd700', size: 3 + Math.random()*3
      });
    }
  }
  if (!jumpPressed) p._jumpHeld = false;

  p.vy += GRAVITY * timeScale;
  p.x += p.vx * timeScale;
  p.y += p.vy * timeScale;

  p.onGround = false;
  for (const plat of gameState.platforms) {
    if (p.x + p.w > plat.x && p.x < plat.x + plat.w) {
      if (p.vy >= 0 && p.y + p.h > plat.y && p.y + p.h - p.vy <= plat.y + 12) {
        p.y = plat.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
  }

  if (p.x < 0) p.x = 0;
  const rightLimit = gameState.stageWidth - p.w;
  if (p.x > rightLimit) p.x = rightLimit;

  const targetCamX = p.x + p.w / 2 - W / 3;
  gameState.camera.x += (targetCamX - gameState.camera.x) * 0.1;
  if (gameState.camera.x < 0) gameState.camera.x = 0;

  generatePlatformsUpTo(p.x + W + 1500);

  if (gameState.charging) {
    gameState.chargeValue += gameState.chargeDirection * 0.012;
    if (gameState.chargeValue >= 1) { gameState.chargeValue = 1; gameState.chargeDirection = -1; }
    else if (gameState.chargeValue <= 0) { gameState.chargeValue = 0; gameState.chargeDirection = 1; }

    const v = gameState.voice;
    const midi = v.minMidi + Math.round(gameState.chargeValue * (v.maxMidi - v.minMidi));
    gameState.lastNote = midiToName(midi);

    if (Math.random() < 0.3) {
      const col = gameState.chargeValue < 0.5
        ? lerpColor(v.colors.low, v.colors.mid, gameState.chargeValue * 2)
        : lerpColor(v.colors.mid, v.colors.top, (gameState.chargeValue - 0.5) * 2);
      gameState.particles.push({
        x: p.x + p.w / 2 + (Math.random() - 0.5) * 40,
        y: p.y + 20,
        vx: (Math.random() - 0.5) * 2,
        vy: -1 - Math.random() * 2,
        life: 0.8, maxLife: 0.8, color: col, size: 2 + Math.random() * 3
      });
    }
  }

  for (let i = gameState.collectibleNotes.length - 1; i >= 0; i--) {
    const cn = gameState.collectibleNotes[i];
    if (cn.collected) continue;
    cn.bob += 0.06;

    if (cn.magnet) {
      const dx = (p.x + p.w/2) - cn.x;
      const dy = (p.y + p.h/2) - cn.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        cn.x += (dx / dist) * 12 * timeScale;
        cn.y += (dy / dist) * 12 * timeScale;
      }
    }

    if (p.x + p.w > cn.x - 15 && p.x < cn.x + 15 &&
        p.y + p.h > cn.y - 15 && p.y < cn.y + 15) {
      cn.collected = true;
      const value = cn.type === 'single' ? 1 : 5;
      gameState.score += value;
      gameState.notesCollected++;
      updateObjectiveHUD();

      gameState.particles.push({
        x: cn.x, y: cn.y - 10, vx: 0, vy: -1.5,
        life: 1.0, maxLife: 1.0,
        color: cn.type === 'single' ? '#ffd700' : '#ff8c00',
        size: 4, text: '+' + value, isText: true
      });

      for (let j = 0; j < 10; j++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 4;
        gameState.particles.push({
          x: cn.x, y: cn.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
          life: 0.7, maxLife: 0.7,
          color: cn.type === 'single' ? '#ffd700' : '#ff8c00',
          size: 2 + Math.random() * 3
        });
      }

      gameState.collectibleNotes.splice(i, 1);
    }
  }

  for (let i = gameState.notes.length - 1; i >= 0; i--) {
    const n = gameState.notes[i];
    n.x += n.vx * timeScale;
    n.y += n.vy * timeScale;
    n.vy += 0.15 * timeScale;
    n.rot += n.rotSpeed * timeScale;
    n.vx *= 0.995;
    n.life -= 0.004 * timeScale;

    let hit = false;
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (n.x + n.size * 0.5 > enemy.x &&
          n.x - n.size * 0.5 < enemy.x + enemy.w &&
          n.y + n.size * 0.5 > enemy.y &&
          n.y - n.size * 0.5 < enemy.y + enemy.h) {

        enemy.hp -= n.damage;
        enemy.hitFlash = 0.3;

        gameState.particles.push({
          x: n.x, y: n.y,
          vx: (Math.random() - 0.5) * 2, vy: -2,
          life: 0.8, maxLife: 0.8, color: '#fff',
          size: 4, text: Math.round(n.damage), isText: true
        });

        for (let j = 0; j < 12; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 5;
          gameState.particles.push({
            x: enemy.x + enemy.w / 2, y: enemy.y + enemy.h / 2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.9, maxLife: 0.9, color: n.color, size: 3 + Math.random() * 4
          });
        }

        if (enemy.hp <= 0) {
          enemy.alive = false;
          enemy.hitFlash = 0.5;
          gameState.score += 100;
          onEnemyKilled();
          for (let j = 0; j < 15; j++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 3 + Math.random() * 6;
            gameState.particles.push({
              x: enemy.x + enemy.w / 2, y: enemy.y + enemy.h / 2,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
              life: 1.0, maxLife: 1.0, color: '#ffd700', size: 4 + Math.random() * 5
            });
          }
        }

        hit = true;
        break;
      }
    }

    // Столкновение с боссом
    if (!hit && gameState.boss && gameState.boss.hp > 0) {
      const b = gameState.boss;
      if (n.x + n.size * 0.5 > b.x &&
          n.x - n.size * 0.5 < b.x + b.w &&
          n.y + n.size * 0.5 > b.y &&
          n.y - n.size * 0.5 < b.y + b.h) {
        b.hp -= n.damage;
        b.hitFlash = 0.3;
        gameState.particles.push({
          x: n.x, y: n.y,
          vx: (Math.random() - 0.5) * 2, vy: -2,
          life: 0.8, maxLife: 0.8, color: '#fff',
          size: 5, text: Math.round(n.damage), isText: true
        });
        for (let j = 0; j < 14; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 5;
          gameState.particles.push({
            x: b.x + b.w / 2, y: b.y + b.h / 2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.9, maxLife: 0.9, color: n.color, size: 3 + Math.random() * 4
          });
        }
        if (b.hp <= 0) {
          gameState.score += 500;
          for (let j = 0; j < 40; j++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 4 + Math.random() * 8;
            gameState.particles.push({
              x: b.x + b.w / 2, y: b.y + b.h / 2,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
              life: 1.5, maxLife: 1.5, color: '#ffd700', size: 5 + Math.random() * 6
            });
          }
        }
        hit = true;
      }
    }

    if (hit || n.life <= 0 || n.x < gameState.camera.x - 200 || n.x > gameState.camera.x + W + 400) {
      gameState.notes.splice(i, 1);
    }
  }

  for (const enemy of gameState.enemies) {
    if (!enemy.alive) {
      if (enemy.hitFlash > 0) enemy.hitFlash -= effectiveDt;
      continue;
    }
    if (gameState.effects.frozen <= 0) {
      enemy.x += enemy.vx * timeScale;
    }
    enemy.wobble += 0.1 * timeScale;
    if (enemy.x < enemy.patrolMinX) { enemy.x = enemy.patrolMinX; if (gameState.effects.frozen <= 0) enemy.vx *= -1; }
    if (enemy.x + enemy.w > enemy.patrolMaxX) { enemy.x = enemy.patrolMaxX - enemy.w; if (gameState.effects.frozen <= 0) enemy.vx *= -1; }
  }

  // Босс
  if (gameState.boss && gameState.boss.hp > 0) {
    const b = gameState.boss;
    b.bob += 0.08 * timeScale;
    if (b.hitFlash > 0) b.hitFlash -= effectiveDt;

    // Простое поведение босса: патрулирование и стрельба
    b.attackTimer -= effectiveDt;
    if (b.attackTimer <= 0 && gameState.effects.frozen <= 0) {
      b.attackTimer = 1.6 + Math.random() * 1.2;
      // Выстрел снарядом в игрока
      const dx = (p.x + p.w/2) - (b.x + b.w/2);
      const dy = (p.y + p.h/2) - (b.y + b.h/2);
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const spd = 6;
      b.projectiles.push({
        x: b.x + b.w/2, y: b.y + b.h/2,
        vx: (dx/dist) * spd, vy: (dy/dist) * spd,
        life: 3.0
      });
    }

    // Движение босса вбок
    if (gameState.effects.frozen <= 0) {
      b.x += Math.sin(gameState.time * 0.7) * 1.5 * timeScale;
      b.x = Math.max(gameState.stageWidth - 600, Math.min(gameState.stageWidth - 100, b.x));
    }

    // Обновление снарядов босса
    for (let i = b.projectiles.length - 1; i >= 0; i--) {
      const proj = b.projectiles[i];
      proj.x += proj.vx * timeScale;
      proj.y += proj.vy * timeScale;
      proj.life -= effectiveDt;

      // Столкновение с игроком
      if (gameState.invulnTimer <= 0 && gameState.health > 0) {
        if (proj.x > p.x && proj.x < p.x + p.w && proj.y > p.y && proj.y < p.y + p.h) {
          if (gameState.effects.shield > 0) {
            gameState.effects.shield = 0;
            gameState.invulnTimer = 1.0;
            spawnTextParticles(p.x + p.w/2, p.y, '🛡️ Щит!', '#4fc3f7');
          } else {
            gameState.health--;
            gameState.invulnTimer = 1.5;
            p.vx = (Math.random() < 0.5 ? -1 : 1) * 10;
            p.vy = -8;
            for (let j = 0; j < 20; j++) {
              const ang = Math.random() * Math.PI * 2;
              const spd = 3 + Math.random() * 6;
              gameState.particles.push({
                x: p.x + p.w / 2, y: p.y + p.h / 2,
                vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
                life: 0.8, maxLife: 0.8, color: '#ff3030', size: 3 + Math.random() * 4
              });
            }
            if (gameState.health <= 0) gameState.deathTimer = 2;
          }
          b.projectiles.splice(i, 1);
          continue;
        }
      }

      if (proj.life <= 0 || proj.x < gameState.camera.x - 200 || proj.x > gameState.camera.x + W + 200) {
        b.projectiles.splice(i, 1);
      }
    }

    // Столкновение игрока с боссом
    if (gameState.invulnTimer <= 0 && gameState.health > 0) {
      if (p.x + p.w > b.x && p.x < b.x + b.w && p.y + p.h > b.y && p.y < b.y + b.h) {
        if (gameState.effects.shield > 0) {
          gameState.effects.shield = 0;
          gameState.invulnTimer = 1.0;
          spawnTextParticles(p.x + p.w/2, p.y, '🛡️ Щит!', '#4fc3f7');
        } else {
          gameState.health--;
          gameState.invulnTimer = 1.5;
          p.vx = (p.x < b.x ? -1 : 1) * 10;
          p.vy = -8;
        }
      }
    }
  }

  if (gameState.invulnTimer > 0) gameState.invulnTimer -= effectiveDt;

  if (gameState.invulnTimer <= 0 && gameState.health > 0) {
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (p.x + p.w > enemy.x && p.x < enemy.x + enemy.w &&
          p.y + p.h > enemy.y && p.y < enemy.y + enemy.h) {
        if (gameState.effects.shield > 0) {
          gameState.effects.shield = 0;
          gameState.invulnTimer = 1.0;
          spawnTextParticles(p.x + p.w/2, p.y, '🛡️ Щит!', '#4fc3f7');
          const dir = (p.x + p.w/2 < enemy.x + enemy.w/2) ? -1 : 1;
          enemy.vx = dir * 8;
          p.vx = -dir * 6;
          p.vy = -6;
          continue;
        }
        gameState.health--;
        gameState.invulnTimer = 1.5;
        p.vx = (p.x + p.w/2 < enemy.x + enemy.w/2 ? -1 : 1) * 10;
        p.vy = -8;
        for (let j = 0; j < 20; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 6;
          gameState.particles.push({
            x: p.x + p.w / 2, y: p.y + p.h / 2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.8, maxLife: 0.8, color: '#ff3030', size: 3 + Math.random() * 4
          });
        }
        if (gameState.health <= 0) gameState.deathTimer = 2;
        break;
      }
    }
  }

  if (gameState.deathTimer > 0) {
    gameState.deathTimer -= effectiveDt;
    if (gameState.deathTimer <= 0) {
      // На этапе босса — поражение и рестарт. На остальных — возрождение.
      if (gameState.stageDef && gameState.stageDef.type === 'boss') {
        gameOver();
        return;
      }
      gameState.health = 3;
      p.x = Math.max(100, gameState.camera.x + 100);
      p.y = gameState.groundY - p.h - 200;
      p.vx = 0; p.vy = 0;
      gameState.invulnTimer = 2;
    }
  }

  for (let i = gameState.particles.length - 1; i >= 0; i--) {
    const pt = gameState.particles[i];
    pt.x += pt.vx * timeScale;
    pt.y += pt.vy * timeScale;
    if (!pt.isText) pt.vy += 0.08 * timeScale;
    pt.life -= effectiveDt;
    if (pt.life <= 0) gameState.particles.splice(i, 1);
  }

  updateEffects(effectiveDt);
  updateCooldowns(effectiveDt);

  // Проверка завершения этапа
  checkStageComplete();

  document.getElementById('noteDisplay').textContent = gameState.lastNote;
  document.getElementById('noteDisplay').style.color = gameState.charging
    ? (gameState.chargeValue < 0.5
        ? lerpColor(gameState.voice.colors.low, gameState.voice.colors.mid, gameState.chargeValue * 2)
        : lerpColor(gameState.voice.colors.mid, gameState.voice.colors.top, (gameState.chargeValue - 0.5) * 2))
    : '#ffd700';
  document.getElementById('barFill').style.width = (gameState.chargeValue * 100) + '%';
  document.getElementById('health').innerHTML = '❤️'.repeat(Math.max(0, gameState.health));
  document.getElementById('score').textContent = '𝄞' + gameState.score;
}

function updateEffects(dt) {
  const fx = gameState.effects;
  if (fx.frozen > 0) fx.frozen -= dt;
  if (fx.invuln > 0) fx.invuln -= dt;
  if (fx.slow > 0) fx.slow -= dt;
  if (fx.doubleJump > 0) fx.doubleJump -= dt;
  if (fx.rage > 0) fx.rage -= dt;

  for (let i = gameState.activeEffects.length - 1; i >= 0; i--) {
    gameState.activeEffects[i].time -= dt;
    if (gameState.activeEffects[i].time <= 0) {
      gameState.activeEffects.splice(i, 1);
    }
  }
  renderEffectBadges();
}

function renderEffectBadges() {
  const el = document.getElementById('effects');
  el.innerHTML = '';
  for (const eff of gameState.activeEffects) {
    const badge = document.createElement('div');
    badge.className = 'effect-badge';
    badge.style.borderColor = eff.color;
    badge.style.color = eff.color;
    badge.textContent = eff.name + ' ' + Math.ceil(eff.time) + 'с';
    el.appendChild(badge);
  }
}

function updateCooldowns(dt) {
  for (const key in gameState.ariaCooldowns) {
    if (gameState.ariaCooldowns[key] > 0) {
      gameState.ariaCooldowns[key] -= dt;
      if (gameState.ariaCooldowns[key] < 0) gameState.ariaCooldowns[key] = 0;
    }
  }
}
function render() {
  const camX = gameState.camera.x;
  const theme = themeAt(camX + W / 2);

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.bg[0]);
  grad.addColorStop(0.5, theme.bg[1]);
  grad.addColorStop(1, theme.bg[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // ===== УНИКАЛЬНЫЕ ДЕКОРАЦИИ УРОВНЯ (параллакс) =====
  ctx.save();
  ctx.translate(-camX * 0.3, 0);
  const startTile = Math.floor((camX * 0.3 - 300) / 500);
  const endTile = Math.ceil((camX * 0.3 + W + 300) / 500);
  for (let i = startTile; i <= endTile; i++) {
    const x = i * 500 + 100;
    drawOperaDeco(ctx, x, theme.decoShape, i, theme);
  }
  ctx.restore();

  // Туман атмосферы
  if (theme.fog) {
    const fogGrad = ctx.createLinearGradient(0, H * 0.3, 0, H);
    fogGrad.addColorStop(0, 'rgba(0,0,0,0)');
    fogGrad.addColorStop(1, theme.fog);
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, 0, W, H);
  }

  if (gameState.effects.frozen > 0) {
    ctx.fillStyle = 'rgba(79, 195, 247, 0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  if (gameState.effects.rage > 0) {
    ctx.fillStyle = 'rgba(231, 76, 60, 0.08)';
    ctx.fillRect(0, 0, W, H);
  }

  // Прожектор сверху
  ctx.save();
  const spotX = W / 2;
  const spotGrad = ctx.createRadialGradient(spotX, -100, 50, spotX, H * 0.6, H);
  spotGrad.addColorStop(0, 'rgba(255, 240, 200, 0.15)');
  spotGrad.addColorStop(1, 'rgba(255, 240, 200, 0)');
  ctx.fillStyle = spotGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.translate(-camX, 0);

  // ===== ПЛАТФОРМЫ =====
  for (const plat of gameState.platforms) {
    if (plat.x + plat.w < camX - 100) continue;
    if (plat.x > camX + W + 100) continue;

    const t = plat.theme || theme;

    if (plat.isGround) {
      const g2 = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
      g2.addColorStop(0, t.ground[0]);
      g2.addColorStop(0.1, t.ground[1]);
      g2.addColorStop(1, t.ground[2]);
      ctx.fillStyle = g2;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < plat.w; i += 60) {
        ctx.beginPath();
        ctx.moveTo(plat.x + i, plat.y);
        ctx.lineTo(plat.x + i, plat.y + plat.h);
        ctx.stroke();
      }
      ctx.strokeStyle = t.platEdge;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(plat.x, plat.y);
      ctx.lineTo(plat.x + plat.w, plat.y);
      ctx.stroke();
    } else {
      const g3 = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
      g3.addColorStop(0, t.platTop);
      g3.addColorStop(0.5, t.platMid);
      g3.addColorStop(1, t.platBot);
      ctx.fillStyle = g3;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.strokeStyle = t.platEdge;
      ctx.lineWidth = 2;
      ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);

      ctx.fillStyle = 'rgba(255, 248, 220, 0.35)';
      for (let i = 10; i < plat.w - 10; i += 25) {
        ctx.beginPath();
        ctx.arc(plat.x + i, plat.y + plat.h / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // ===== СОБИРАЕМЫЕ НОТЫ =====
  for (const cn of gameState.collectibleNotes) {
    if (cn.collected) continue;
    if (cn.x < camX - 100 || cn.x > camX + W + 100) continue;
    const bobY = Math.sin(cn.bob) * 5;
    const color = cn.type === 'single' ? '#ffd700' : '#ff8c00';

    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.font = cn.type === 'single' ? 'bold 28px Georgia' : 'bold 34px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cn.type === 'single' ? '♪' : '♫', cn.x, cn.y + bobY);
    ctx.restore();
  }

  // ===== ЛЕТЯЩИЕ НОТЫ =====
  for (const n of gameState.notes) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, n.life * 1.5);
    ctx.translate(n.x, n.y);
    ctx.rotate(n.rot);

    ctx.shadowBlur = 20;
    ctx.shadowColor = n.color;

    ctx.fillStyle = n.color;
    ctx.beginPath();
    ctx.ellipse(0, n.size * 0.2, n.size * 0.4, n.size * 0.3, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = n.color;
    ctx.lineWidth = Math.max(2, n.size / 6);
    ctx.beginPath();
    ctx.moveTo(n.size * 0.32, n.size * 0.15);
    ctx.lineTo(n.size * 0.32, -n.size * 0.8);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(n.size * 0.32, -n.size * 0.8);
    ctx.quadraticCurveTo(n.size * 0.8, -n.size * 0.5, n.size * 0.32, -n.size * 0.15);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(10, n.size * 0.5)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(n.noteName, 0, -n.size * 1.1);

    ctx.restore();
  }

  // ===== ЧАСТИЦЫ =====
  for (const pt of gameState.particles) {
    ctx.save();
    ctx.globalAlpha = pt.life / pt.maxLife;
    if (pt.isText) {
      ctx.fillStyle = pt.color;
      ctx.font = (pt.big ? 'bold 32px' : 'bold 18px') + ' Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(pt.text, pt.x, pt.y);
    } else {
      ctx.fillStyle = pt.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ===== ВРАГИ =====
  for (const enemy of gameState.enemies) {
    if (enemy.x + enemy.w < camX - 100) continue;
    if (enemy.x > camX + W + 100) continue;

    if (!enemy.alive) {
      if (enemy.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = enemy.hitFlash / 0.5;
        drawCritic(enemy, true);
        ctx.restore();
      }
      continue;
    }

    if (gameState.effects.frozen > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawCritic(enemy, false);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = 'rgba(79, 195, 247, 0.35)';
      ctx.beginPath();
      ctx.arc(enemy.x + enemy.w/2, enemy.y + enemy.h/2, enemy.w * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      drawCritic(enemy, false);
    }

    if (enemy.hp < enemy.maxHp) {
      const barW = enemy.w, barH = 6;
      const barX = enemy.x, barY = enemy.y - 14;
      const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);
      let hpColor = '#e74c3c';
      if (hpRatio > 0.6) hpColor = '#2ecc71';
      else if (hpRatio > 0.3) hpColor = '#f39c12';
      ctx.fillStyle = hpColor;
      ctx.fillRect(barX, barY, barW * hpRatio, barH);
    }
  }

  // ===== БОСС =====
  if (gameState.boss) {
    const b = gameState.boss;
    if (b.x + b.w > camX - 200 && b.x < camX + W + 200) {
      drawBoss(b);
    }
  }

  // ===== ИГРОК =====
  if (gameState.player) {
    drawSinger(gameState.player, gameState.charging, gameState.chargeValue);
  }

  ctx.restore();

  // ===== ВИНЬЕТКА =====
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // ===== ИНФО В ПРАВОМ ВЕРХНЕМ УГЛУ =====
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#fff';
  ctx.font = '16px Georgia';
  ctx.textAlign = 'right';
  ctx.fillText('🎭 ' + theme.name, W - 20, 30);
  ctx.fillText('📍 ' + Math.floor(gameState.player.x) + ' px', W - 20, 54);

  if (!gameState.paused && gameState.health > 0 && !gameState.stageComplete) {
    ctx.globalAlpha = 0.4 + Math.sin(gameState.time * 2) * 0.2;
    ctx.font = '14px Georgia';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('👆 Кликните по певцу для выбора арии', W / 2, H - 25);
  }
  ctx.restore();

  if (gameState.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
  }
}



// ===== УНИКАЛЬНЫЕ ДЕКОРАЦИИ ДЛЯ КАЖДОЙ ОПЕРЫ =====
function drawOperaDeco(c, x, shape, seed, theme) {
  const baseY = 100;
  c.save();
  c.translate(x, baseY);
  const t = gameState.time;

  switch (shape) {
    // ===== 1. РУСЛАН И ЛЮДМИЛА — купола церквей =====
    case 'dome': {
      c.fillStyle = theme.deco;
      c.beginPath(); c.arc(60, 0, 45, Math.PI, 0); c.fill();
      c.fillRect(15, 0, 90, 120);
      c.strokeStyle = theme.platEdge; c.lineWidth = 2;
      c.beginPath(); c.arc(60, 0, 45, Math.PI, 0); c.stroke();
      // Крест
      c.beginPath(); c.moveTo(60, -45); c.lineTo(60, -65); c.stroke();
      c.beginPath(); c.moveTo(52, -57); c.lineTo(68, -57); c.stroke();
      break;
    }

    // ===== 2. САДКО — пузыри и волны =====
    case 'bubble': {
      for (let j = 0; j < 5; j++) {
        const bx = 40 + j * 70 + Math.sin(t * 0.5 + j + seed) * 20;
        const by = -50 - j * 80 + Math.cos(t * 0.7 + j) * 15;
        const r = 8 + j * 3;
        c.fillStyle = theme.deco;
        c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.fill();
        c.strokeStyle = theme.platEdge; c.lineWidth = 1;
        c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.stroke();
      }
      // Волна на дне
      c.strokeStyle = theme.deco; c.lineWidth = 3;
      c.beginPath();
      for (let px = 0; px <= 500; px += 10) {
        const py = 100 + Math.sin(px * 0.02 + t + seed) * 8;
        if (px === 0) c.moveTo(px, py); else c.lineTo(px, py);
      }
      c.stroke();
      break;
    }

    // ===== 3. БОРИС ГОДУНОВ — кресты и купола =====
    case 'cross': {
      c.fillStyle = theme.deco;
      for (let j = 0; j < 3; j++) {
        const bx = 60 + j * 150;
        c.fillRect(bx - 5, -80, 10, 180);
        c.fillRect(bx - 25, -50, 50, 8);
        c.beginPath(); c.arc(bx, -80, 15, Math.PI, 0); c.fill();
      }
      break;
    }

    // ===== 4. ФАУСТ — колбы и свечи =====
    case 'flask': {
      for (let j = 0; j < 4; j++) {
        const bx = 50 + j * 100;
        const by = -30;
        // Колба
        c.fillStyle = theme.deco;
        c.beginPath();
        c.moveTo(bx - 10, by); c.lineTo(bx - 15, by + 40);
        c.lineTo(bx + 15, by + 40); c.lineTo(bx + 10, by);
        c.closePath(); c.fill();
        // Горлышко
        c.fillRect(bx - 6, by - 20, 12, 20);
        // Свеча
        c.fillStyle = '#ffcc00';
        c.fillRect(bx + 30, by + 10, 6, 30);
        c.fillStyle = '#ff6600';
        c.beginPath(); c.ellipse(bx + 33, by + 6, 3, 6, 0, 0, Math.PI * 2); c.fill();
      }
      break;
    }

    // ===== 5. ЖИЗНЬ ЗА ЦАРЯ — снежинки и ели =====
    case 'snow': {
      c.fillStyle = theme.deco;
      for (let j = 0; j < 6; j++) {
        const sx = 30 + j * 80 + Math.sin(t + j + seed) * 15;
        const sy = -20 + (j * 30 + t * 20 + seed * 10) % 150;
        c.beginPath(); c.arc(sx, sy, 2, 0, Math.PI * 2); c.fill();
      }
      // Ели
      c.fillStyle = 'rgba(20, 60, 30, 0.5)';
      for (let j = 0; j < 2; j++) {
        const ex = 100 + j * 250;
        c.beginPath();
        c.moveTo(ex, -20); c.lineTo(ex - 40, 80); c.lineTo(ex + 40, 80);
        c.closePath(); c.fill();
        c.beginPath();
        c.moveTo(ex, -60); c.lineTo(ex - 30, 30); c.lineTo(ex + 30, 30);
        c.closePath(); c.fill();
      }
      break;
    }

    // ===== 6. ЕВГЕНИЙ ОНЕГИН — люстры =====
    case 'chandelier': {
      c.strokeStyle = theme.platTop; c.lineWidth = 2;
      c.beginPath(); c.moveTo(80, -100); c.lineTo(80, -30); c.stroke();
      c.fillStyle = theme.deco;
      c.beginPath(); c.ellipse(80, -20, 30, 15, 0, 0, Math.PI * 2); c.fill();
      for (let j = -3; j <= 3; j++) {
        c.fillStyle = '#ffd700';
        c.fillRect(80 + j * 8 - 2, -35, 4, 15);
        c.fillStyle = '#ff8c00';
        c.beginPath(); c.ellipse(80 + j * 8, -38, 3, 5, 0, 0, Math.PI * 2); c.fill();
      }
      break;
    }

    // ===== 7. ПИКОВАЯ ДАМА — карты =====
    case 'cards': {
      for (let j = 0; j < 3; j++) {
        c.save();
        c.translate(80 + j * 120, 0);
        c.rotate(Math.sin(t * 0.5 + j) * 0.1);
        c.fillStyle = theme.deco;
        c.fillRect(-25, -40, 50, 70);
        c.strokeStyle = theme.platEdge; c.lineWidth = 2;
        c.strokeRect(-25, -40, 50, 70);
        c.fillStyle = '#000';
        c.font = 'bold 20px Georgia';
        c.textAlign = 'center';
        c.fillText(['♠','♥','♣'][j], 0, 5);
        c.restore();
      }
      break;
    }

    // ===== 8. КНЯЗЬ ИГОРЬ — костры =====
    case 'fire': {
      for (let j = 0; j < 3; j++) {
        const fx = 80 + j * 150;
        const fh = 40 + Math.sin(t * 5 + j) * 15;
        c.fillStyle = 'rgba(255, 100, 0, 0.4)';
        c.beginPath();
        c.moveTo(fx - 20, 100);
        c.quadraticCurveTo(fx, 100 - fh, fx + 20, 100);
        c.closePath(); c.fill();
        c.fillStyle = 'rgba(255, 200, 0, 0.5)';
        c.beginPath();
        c.moveTo(fx - 10, 100);
        c.quadraticCurveTo(fx, 100 - fh * 0.7, fx + 10, 100);
        c.closePath(); c.fill();
      }
      break;
    }

    // ===== 9. АИДА — пирамиды =====
    case 'pyramid': {
      c.fillStyle = theme.deco;
      c.beginPath();
      c.moveTo(80, 100); c.lineTo(140, -60); c.lineTo(200, 100);
      c.closePath(); c.fill();
      c.strokeStyle = theme.platEdge; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(80, 100); c.lineTo(140, -60); c.lineTo(200, 100);
      c.closePath(); c.stroke();
      // Солнце
      c.fillStyle = 'rgba(255, 215, 0, 0.3)';
      c.beginPath(); c.arc(140, -100, 30, 0, Math.PI * 2); c.fill();
      break;
    }

    // ===== 10. ТРАВИАТА — розы =====
    case 'rose': {
      for (let j = 0; j < 4; j++) {
        const rx = 60 + j * 100;
        const ry = -20 + Math.sin(t + j) * 10;
        c.fillStyle = theme.deco;
        c.beginPath(); c.arc(rx, ry, 12, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 1;
        c.beginPath(); c.arc(rx, ry, 8, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.arc(rx, ry, 4, 0, Math.PI * 2); c.stroke();
      }
      break;
    }

    // ===== 11. РИГОЛЕТТО — маски =====
    case 'mask': {
      for (let j = 0; j < 3; j++) {
        const mx = 80 + j * 140;
        c.fillStyle = theme.deco;
        c.beginPath(); c.ellipse(mx, -20, 25, 35, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#000';
        c.beginPath(); c.ellipse(mx - 8, -25, 5, 8, 0, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(mx + 8, -25, 5, 8, 0, 0, Math.PI * 2); c.fill();
      }
      break;
    }

    // ===== 12. ТОСКА — башни замка =====
    case 'tower': {
      for (let j = 0; j < 2; j++) {
        const tx = 80 + j * 200;
        c.fillStyle = theme.deco;
        c.fillRect(tx - 25, -60, 50, 160);
        for (let k = -2; k <= 2; k++) {
          c.fillRect(tx + k * 12 - 4, -75, 8, 15);
        }
        c.fillStyle = 'rgba(255, 200, 0, 0.4)';
        c.fillRect(tx - 8, -30, 16, 20);
      }
      break;
    }

    // ===== 13. КАРМЕН — солнце =====
    case 'sun': {
      c.fillStyle = 'rgba(255, 150, 0, 0.25)';
      c.beginPath(); c.arc(120, -30, 50, 0, Math.PI * 2); c.fill();
      c.strokeStyle = theme.platEdge; c.lineWidth = 2;
      for (let j = 0; j < 12; j++) {
        const a = (j / 12) * Math.PI * 2 + t * 0.2;
        c.beginPath();
        c.moveTo(120 + Math.cos(a) * 55, -30 + Math.sin(a) * 55);
        c.lineTo(120 + Math.cos(a) * 75, -30 + Math.sin(a) * 75);
        c.stroke();
      }
      break;
    }

    // ===== 14. ВОЛШЕБНАЯ ФЛЕЙТА — звёзды и луна =====
    case 'star': {
      c.fillStyle = theme.deco;
      for (let j = 0; j < 8; j++) {
        const sx = (j * 80 + seed * 40) % 500;
        const sy = -30 - (j % 3) * 40;
        drawStar(c, sx, sy, 5, 10, 4);
      }
      // Луна
      c.fillStyle = 'rgba(200, 200, 255, 0.3)';
      c.beginPath(); c.arc(400, -80, 35, 0, Math.PI * 2); c.fill();
      c.fillStyle = theme.bg[0];
      c.beginPath(); c.arc(415, -85, 30, 0, Math.PI * 2); c.fill();
      break;
    }

    // ===== 15. СВАДЬБА ФИГАРО — виноградные лозы =====
    case 'vine': {
      c.strokeStyle = theme.deco; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(0, -100);
      for (let px = 0; px <= 500; px += 20) {
        const py = -100 + Math.sin(px * 0.02 + seed) * 20;
        c.lineTo(px, py);
      }
      c.stroke();
      c.fillStyle = theme.deco;
      for (let j = 0; j < 8; j++) {
        const lx = j * 60;
        const ly = -100 + Math.sin(lx * 0.02 + seed) * 20;
        c.beginPath(); c.ellipse(lx, ly, 12, 6, Math.PI/4, 0, Math.PI * 2); c.fill();
      }
      break;
    }

    // ===== 16. ДОН ЖУАН — луна и силуэты =====
    case 'moon': {
      c.fillStyle = 'rgba(255, 255, 200, 0.2)';
      c.beginPath(); c.arc(400, -80, 45, 0, Math.PI * 2); c.fill();
      c.fillStyle = theme.deco;
      c.beginPath(); c.arc(400, -80, 45, 0, Math.PI * 2); c.fill();
      // Силуэты домов
      c.fillStyle = 'rgba(0,0,0,0.4)';
      c.fillRect(100, -20, 80, 120);
      c.fillRect(220, 10, 60, 90);
      break;
    }

    // ===== 17. СЕВИЛЬСКИЙ ЦИРЮЛЬНИК — лютни =====
    case 'lute': {
      c.strokeStyle = theme.deco; c.lineWidth = 2;
      for (let j = 0; j < 2; j++) {
        const lx = 100 + j * 200;
        c.beginPath(); c.ellipse(lx, 0, 25, 35, 0, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.moveTo(lx, -35); c.lineTo(lx, -70); c.stroke();
        for (let k = 0; k < 4; k++) {
          c.beginPath(); c.moveTo(lx - 8 + k * 5, -35); c.lineTo(lx - 8 + k * 5, 20); c.stroke();
        }
      }
      break;
    }

    // ===== 18. ЛОЭНГРИН — лебедь и вода =====
    case 'swan': {
      const sx = 120;
      const sy = -20 + Math.sin(t) * 5;
      c.fillStyle = theme.deco;
      c.beginPath(); c.ellipse(sx, sy, 30, 20, 0, 0, Math.PI * 2); c.fill();
      c.beginPath();
      c.moveTo(sx + 20, sy - 10);
      c.quadraticCurveTo(sx + 45, sy - 40, sx + 35, sy - 55);
      c.quadraticCurveTo(sx + 30, sy - 60, sx + 28, sy - 55);
      c.quadraticCurveTo(sx + 35, sy - 40, sx + 15, sy - 15);
      c.closePath(); c.fill();
      c.strokeStyle = theme.deco; c.lineWidth = 2;
      for (let j = 0; j < 3; j++) {
        c.beginPath();
        for (let px = 0; px <= 500; px += 10) {
          const py = 90 + j * 8 + Math.sin(px * 0.03 + t + j) * 4;
          if (px === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.stroke();
      }
      break;
    }

    // ===== 19. ТАНГЕЙЗЕР — сердца =====
    case 'heart': {
      c.fillStyle = theme.deco;
      for (let j = 0; j < 4; j++) {
        const hx = 60 + j * 120;
        const hy = -20 + Math.sin(t * 2 + j) * 8;
        c.beginPath();
        c.moveTo(hx, hy + 10);
        c.bezierCurveTo(hx - 15, hy - 10, hx - 15, hy + 5, hx, hy + 15);
        c.bezierCurveTo(hx + 15, hy + 5, hx + 15, hy - 10, hx, hy + 10);
        c.fill();
      }
      break;
    }

    // ===== 20. ЛЕТУЧИЙ ГОЛЛАНДЕЦ — штормовые волны =====
    case 'wave': {
      c.strokeStyle = theme.deco; c.lineWidth = 4;
      for (let j = 0; j < 3; j++) {
        c.beginPath();
        for (let px = 0; px <= 500; px += 5) {
          const py = -30 + j * 50 + Math.sin(px * 0.05 + t * 2 + j * 2) * 20;
          if (px === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.stroke();
      }
      // Молния
      if (Math.floor(t * 2) % 5 === 0) {
        c.strokeStyle = 'rgba(200, 220, 255, 0.8)';
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(250, -100);
        c.lineTo(230, -50); c.lineTo(260, -40); c.lineTo(240, 10);
        c.stroke();
      }
      break;
    }

    // ===== 21. ВАЛЬКИРИЯ — руны и щиты =====
    case 'rune': {
      c.strokeStyle = theme.deco; c.lineWidth = 3;
      for (let j = 0; j < 3; j++) {
        const rx = 80 + j * 160;
        c.beginPath(); c.arc(rx, -20, 30, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.moveTo(rx - 20, -20); c.lineTo(rx + 20, -20); c.stroke();
        c.beginPath(); c.moveTo(rx, -40); c.lineTo(rx, 0); c.stroke();
        c.beginPath(); c.moveTo(rx - 15, -35); c.lineTo(rx + 15, -5); c.stroke();
      }
      break;
    }

    // ===== Fallback =====
    default: {
      c.fillStyle = theme.deco;
      c.fillRect(50, 100, 80, H - 200);
    }
  }

  c.restore();
}

// Вспомогательная — звезда
function drawStar(c, cx, cy, spikes, outer, inner) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  c.beginPath();
  c.moveTo(cx, cy - outer);
  for (let i = 0; i < spikes; i++) {
    c.lineTo(cx + Math.cos(rot) * outer, cy + Math.sin(rot) * outer);
    rot += step;
    c.lineTo(cx + Math.cos(rot) * inner, cy + Math.sin(rot) * inner);
    rot += step;
  }
  c.lineTo(cx, cy - outer);
  c.closePath();
  c.fill();
}



function drawBoss(b) {
  const cx = b.x + b.w / 2;
  const cy = b.y + b.h / 2 + Math.sin(b.bob) * 6;

  ctx.save();

  // Аура
  ctx.save();
  const auraGrad = ctx.createRadialGradient(cx, cy, 10, cx, cy, b.w * 1.3);
  auraGrad.addColorStop(0, b.color + 'aa');
  auraGrad.addColorStop(1, b.color + '00');
  ctx.fillStyle = auraGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, b.w * 1.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Тело
  const bodyGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  bodyGrad.addColorStop(0, b.color);
  bodyGrad.addColorStop(1, '#000');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(b.x + 20, b.y + 30);
  ctx.lineTo(b.x + b.w - 20, b.y + 30);
  ctx.lineTo(b.x + b.w - 5, b.y + b.h);
  ctx.lineTo(b.x + 5, b.y + b.h);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 3;
  ctx.stroke();

  // Голова
  ctx.fillStyle = '#e8b088';
  ctx.beginPath();
  ctx.arc(cx, b.y + 10, 30, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Корон / шляпа в цвет босса
  ctx.fillStyle = b.color;
  ctx.beginPath();
  ctx.moveTo(cx - 30, b.y - 5);
  ctx.lineTo(cx + 30, b.y - 5);
  ctx.lineTo(cx + 20, b.y - 35);
  ctx.lineTo(cx, b.y - 20);
  ctx.lineTo(cx - 20, b.y - 35);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Глаза
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(cx - 10, b.y + 8, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx + 10, b.y + 8, 4, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // Снаряды
  if (b.projectiles) {
    for (const proj of b.projectiles) {
      ctx.save();
      ctx.shadowBlur = 20;
      ctx.shadowColor = b.color;
      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(proj.x, proj.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // HP bar над боссом
  const barW = 220, barH = 18;
  const barX = cx - barW / 2, barY = b.y - 90;
  const ratio = Math.max(0, b.hp / b.maxHp);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(barX, barY, barW, barH);
  const hpGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  hpGrad.addColorStop(0, '#ff0000');
  hpGrad.addColorStop(0.5, '#ff8c00');
  hpGrad.addColorStop(1, '#e74c3c');
  ctx.fillStyle = hpGrad;
  ctx.fillRect(barX, barY, barW * ratio, barH);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.strokeRect(barX, barY, barW, barH);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(b.name + ' — ' + Math.max(0, Math.round(b.hp)) + ' HP', cx, barY - 8);
  ctx.restore();
}

function drawCritic(enemy, dying) {
  const cx = enemy.x + enemy.w / 2;
  const cy = enemy.y + enemy.h / 2;
  const wobble = Math.sin(enemy.wobble) * 2;

  ctx.save();
  ctx.translate(cx, cy);

  if (dying) {
    ctx.scale(1 + (1 - enemy.hitFlash / 0.5) * 0.5, 1 + (1 - enemy.hitFlash / 0.5) * 0.5);
  }

  ctx.fillStyle = '#3a3a4a';
  ctx.beginPath();
  ctx.moveTo(-14, -20); ctx.lineTo(14, -20); ctx.lineTo(16, 25); ctx.lineTo(-16, 25);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.moveTo(-8, -20); ctx.lineTo(8, -20); ctx.lineTo(6, 10); ctx.lineTo(-6, 10);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#8b0000';
  ctx.beginPath();
  ctx.moveTo(-3, -18); ctx.lineTo(3, -18); ctx.lineTo(4, 5); ctx.lineTo(0, 10); ctx.lineTo(-4, 5);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(-12, 25, 8, 8);
  ctx.fillRect(4, 25, 8, 8);

  ctx.fillStyle = '#d4a88a';
  ctx.beginPath(); ctx.arc(0, -30 + wobble, 13, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(0, -34 + wobble, 13, Math.PI, 0); ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, -32 + wobble); ctx.lineTo(-3, -30 + wobble); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -32 + wobble); ctx.lineTo(3, -30 + wobble); ctx.stroke();

  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-5, -28 + wobble, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -28 + wobble, 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-4, -22 + wobble);
  ctx.quadraticCurveTo(0, -25 + wobble, 4, -22 + wobble);
  ctx.stroke();

  ctx.fillStyle = '#f4e4c0';
  ctx.fillRect(16, -10, 10, 14);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1;
  ctx.strokeRect(16, -10, 10, 14);
  ctx.beginPath();
  ctx.moveTo(17, -6); ctx.lineTo(25, -6);
  ctx.moveTo(17, -3); ctx.lineTo(25, -3);
  ctx.moveTo(17, 0);  ctx.lineTo(22, 0);
  ctx.stroke();

  ctx.fillStyle = '#c0392b';
  ctx.fillRect(10, -38 + wobble, 2, 8);

  ctx.restore();
}

function gameLoop() {
  if (!gameState.voice) return;
  update(1/60);
  render();
  requestAnimationFrame(gameLoop);
}
