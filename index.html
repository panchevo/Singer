<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Оперный Певец - Платформер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; font-family: 'Georgia', serif; }
  canvas { display: block; width: 100%; height: 100%;  cursor: url('cur.png') 0 12, auto !important; }
  #menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 10;
  }
  #menu h1 { font-size: 64px; margin-bottom: 20px; color: #ffd700; text-shadow: 0 0 20px #ffd700; letter-spacing: 4px; }
  #menu p { font-size: 20px; margin-bottom: 40px; color: #ccc; }
  .voice-btn {
    display: flex; align-items: center; gap: 20px;
    padding: 20px 40px; margin: 10px; font-size: 24px;
    border: 2px solid #ffd700; background: rgba(255, 215, 0, 0.1);
    color: #fff;  cursor: url('cur.png') 0 12, auto !important;  border-radius: 10px;
    transition: all 0.3s; font-family: 'Georgia', serif; min-width: 400px;
    justify-content: space-between;
  }
  .voice-btn:hover { background: rgba(255, 215, 0, 0.3); transform: scale(1.05); box-shadow: 0 0 30px #ffd700; }
  .voice-btn .range { font-size: 16px; color: #ffd700; }
  .hint { margin-top: 30px; color: #888; font-size: 16px; text-align: center; max-width: 700px; }
  #hud {
    position: absolute; top: 20px; left: 20px; color: #fff;
    font-size: 18px; text-shadow: 1px 1px 3px #000; z-index: 5;
    pointer-events: none;
  }
  #hud .note-display {
    font-size: 48px; color: #ffd700; font-weight: bold;
    text-shadow: 0 0 20px currentColor;
  }
  #hud .bar {
    width: 200px; height: 10px; border: 1px solid #fff;
    margin-top: 10px; background: rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  #hud .bar-fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: linear-gradient(90deg, #ffd700, #ff8c00);
    transition: width 0.05s;
  }
  #hud .voice-info { margin-top: 5px; color: #ffd700; }

  /* ===== МЕНЮ АРИЙ ===== */
  #ariaMenu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(10, 5, 20, 0.85);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; z-index: 20; backdrop-filter: blur(4px);
  }
  #ariaMenu h2 {
    font-size: 42px; color: #ffd700; margin-bottom: 10px;
    text-shadow: 0 0 20px #ffd700;
  }
  #ariaMenu .subtitle {
    color: #aaa; font-size: 18px; margin-bottom: 30px;
  }
  .aria-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 20px; max-width: 900px; width: 90%;
  }
  .aria-card {
    border: 2px solid #ffd700; border-radius: 12px;
    padding: 20px; background: rgba(255, 215, 0, 0.08);
    cursor: url('cur.png') 0 12, auto !important;  transition: all 0.2s;
    display: flex; flex-direction: column; gap: 8px;
    position: relative; overflow: hidden;
  }
  .aria-card:hover:not(.disabled) {
    background: rgba(255, 215, 0, 0.22);
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
  }
  .aria-card.disabled {
    opacity: 0.4; cursor: not-allowed; border-color: #555;
  }
  .aria-card .aria-name {
    font-size: 22px; color: #ffd700; font-weight: bold;
  }
  .aria-card .aria-desc {
    font-size: 15px; color: #ddd; line-height: 1.4;
  }
  .aria-card .aria-cost {
    font-size: 18px; color: #ff8c00; margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
  }
  .aria-card .aria-cost .cd {
    font-size: 13px; color: #888;
  }
  .aria-card .aria-effect {
    font-size: 13px; color: #4fc3f7; font-style: italic;
  }
  #ariaMenu .close-hint {
    margin-top: 30px; color: #888; font-size: 16px;
  }

  /* Индикаторы активных эффектов */
  #effects {
    position: absolute; top: 20px; right: 20px; z-index: 6;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    pointer-events: none;
  }
  .effect-badge {
    background: rgba(0,0,0,0.6); border: 1px solid #ffd700;
    border-radius: 20px; padding: 6px 14px;
    color: #ffd700; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    from { box-shadow: 0 0 5px rgba(255,215,0,0.4); }
    to   { box-shadow: 0 0 18px rgba(255,215,0,0.9); }
  }
body{ cursor: url('cur.png') 0 12, auto !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" style="display:none">
  <div class="note-display" id="noteDisplay">C3</div>
  <div class="bar"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
  <div class="voice-info" id="voiceInfo">Тенор</div>
  <div id="health" style="margin-top:8px; font-size:22px;"></div>
  <div id="score" style="margin-top:4px; font-size:30px; color:#ccc;">𝄞0</div>
</div>
<div id="effects"></div>

<div id="menu">
  <h1>ОПЕРНЫЙ ПЕВЕЦ</h1>
  <p>Выберите тип голоса</p>
  <button class="voice-btn" data-voice="tenor">
    <span>🎭 Тенор</span><span class="range">C3 – C5</span>
  </button>
  <button class="voice-btn" data-voice="bass">
    <span>🎭 Бас</span><span class="range">E2 – E4</span>
  </button>
  <button class="voice-btn" data-voice="baritone">
    <span>🎭 Баритон</span><span class="range">A2 – A4</span>
  </button>
  <p class="hint">← → или A/D — движение &nbsp;|&nbsp; SPACE — прыжок &nbsp;|&nbsp; Удерживайте ENTER — набор высоты голоса, отпустите — выстрел нотой &nbsp;|&nbsp; Собирайте ♪ и ♫ &nbsp;|&nbsp; КЛИК по персонажу — меню арий</p>
</div>

<!-- ===== МЕНЮ ВЫБОРА АРИЙ ===== -->
<div id="ariaMenu">
  <h2 id="ariaMenuTitle">Арии</h2>
  <div class="subtitle" id="ariaMenuSubtitle">Выберите арию</div>
  <div class="aria-grid" id="ariaGrid"></div>
  <div class="close-hint">Нажмите ESC или кликните по фону, чтобы закрыть</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ===== Музыкальные ноты =====
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiToName(m) {
  const octave = Math.floor(m / 12) - 1;
  return NOTE_NAMES[((m % 12) + 12) % 12] + octave;
}

// ===== Типы голосов =====
const VOICE_TYPES = {
  tenor:   { name:'Тенор',   minMidi:48, maxMidi:72, colors:{top:'#ffd700',mid:'#ff8c00',low:'#8b4513'}, damageBase:1.6, damageCurve:t=>0.4+t*1.6, damageDesc:'Высокий голос' },
  bass:    { name:'Бас',     minMidi:40, maxMidi:64, colors:{top:'#8b4513',mid:'#ff8c00',low:'#ffd700'}, damageBase:1.0, damageCurve:t=>2.0-t*1.6, damageDesc:'Низкий голос' },
  baritone:{ name:'Баритон', minMidi:45, maxMidi:69, colors:{top:'#c0392b',mid:'#ffd700',low:'#ff8c00'}, damageBase:1.3, damageCurve:t=>0.6+1.4*(1-Math.abs(t-0.5)*2), damageDesc:'Средний голос' }
};

// ===== АРИИ =====
// effect: функция, применяющая эффект
// duration: длительность в секундах (если применимо)
// cooldown: перезарядка в секундах
// cost: стоимость в очках
const ARIAS = {
  tenor: [
    {
      id: 'lensky',
      name: 'Ария Ленского',
      desc: '«Куда, куда вы удалились...» — замораживает всех врагов на экране.',
      effect: 'freeze',
      duration: 5,
      cooldown: 12,
      cost: 150,
      color: '#4fc3f7',
      icon: '❄️'
    },
    {
      id: 'serenade',
      name: 'Серенада',
      desc: '«Соловей мой, соловей...» — восстанавливает 1 единицу здоровья.',
      effect: 'heal',
      duration: 0,
      cooldown: 15,
      cost: 100,
      color: '#2ecc71',
      icon: '💚'
    },
    {
      id: 'vincero',
      name: 'Vincerò!',
      desc: '«Nessun dorma» — выпускает залп из 5 нот веером.',
      effect: 'volley',
      duration: 0,
      cooldown: 10,
      cost: 120,
      color: '#ff8c00',
      icon: '🎯'
    },
    {
      id: 'romance',
      name: 'Романс',
      desc: '«Я помню чудное мгновенье...» — замедляет время на 6 секунд.',
      effect: 'slow',
      duration: 6,
      cooldown: 18,
      cost: 180,
      color: '#ba68c8',
      icon: '⏳'
    }
  ],
  bass: [
    {
      id: 'varlaam',
      name: 'Песня Варлаама',
      desc: '«Как во городе было во Казани...» — даёт временную неуязвимость.',
      effect: 'invuln',
      duration: 5,
      cooldown: 14,
      cost: 150,
      color: '#ffd700',
      icon: '🛡️'
    },
    {
      id: 'boris',
      name: 'Ария Бориса',
      desc: '«Скорбит душа...» — создаёт щит, поглощающий следующий удар.',
      effect: 'shield',
      duration: 15,
      cooldown: 12,
      cost: 100,
      color: '#4fc3f7',
      icon: '🔵'
    },
    {
      id: 'flea',
      name: 'Песня о блохе',
      desc: '«Жил-был король когда-то...» — взрыв, наносящий урон всем врагам на экране.',
      effect: 'explosion',
      duration: 0,
      cooldown: 16,
      cost: 200,
      color: '#e74c3c',
      icon: '💥'
    },
    {
      id: 'requiem',
      name: 'Реквием',
      desc: '«Dies irae» — мгновенно уничтожает всех врагов на экране.',
      effect: 'killAll',
      duration: 0,
      cooldown: 30,
      cost: 350,
      color: '#c0392b',
      icon: '☠️'
    }
  ],
  baritone: [
    {
      id: 'figaro',
      name: 'Ария Фигаро',
      desc: '«Largo al factotum» — даёт двойной прыжок на 8 секунд.',
      effect: 'doubleJump',
      duration: 8,
      cooldown: 12,
      cost: 120,
      color: '#ffd700',
      icon: '🦘'
    },
    {
      id: 'donjuan',
      name: 'Серенада Дон Жуана',
      desc: '«Deh, vieni alla finestra» — притягивает все ноты на экране к игроку.',
      effect: 'magnet',
      duration: 0,
      cooldown: 10,
      cost: 80,
      color: '#ff8c00',
      icon: '🧲'
    },
    {
      id: 'onegin',
      name: 'Ария Онегина',
      desc: '«Когда бы жизнь домашним кругом...» — отталкивает всех врагов от игрока.',
      effect: 'push',
      duration: 0,
      cooldown: 14,
      cost: 130,
      color: '#4fc3f7',
      icon: '💨'
    },
    {
      id: 'toreador',
      name: 'Песня Тореадора',
      desc: '«Toréador, en garde!» — удваивает урон от нот на 8 секунд.',
      effect: 'rage',
      duration: 8,
      cooldown: 18,
      cost: 200,
      color: '#e74c3c',
      icon: '⚔️'
    }
  ]
};

// ===== ТЕМЫ ЛАНДШАФТА =====
const THEMES = [
  { name:'Театр',       bg:['#2c0a0a','#4a1010','#1a0505'], platTop:'#ffd700', platMid:'#b8860b', platBot:'#6b4400', platEdge:'#fff8dc', ground:['#5a3a1a','#4a2a10','#2a1505'], deco:'rgba(255,215,0,0.08)' },
  { name:'Подвал',      bg:['#0a1a2c','#102a4a','#050a15'], platTop:'#4fc3f7', platMid:'#0288d1', platBot:'#01579b', platEdge:'#b3e5fc', ground:['#1a2a3a','#0a1520','#050a10'], deco:'rgba(79,195,247,0.08)' },
  { name:'Крыша',       bg:['#1a0a2e','#2a1050','#0a0515'], platTop:'#ba68c8', platMid:'#7b1fa2', platBot:'#4a0072', platEdge:'#e1bee7', ground:['#2a1a3a','#1a0a25','#0a0510'], deco:'rgba(186,104,200,0.08)' },
  { name:'Бальный зал', bg:['#2c1a05','#4a3010','#1a0d02'], platTop:'#ffab40', platMid:'#e65100', platBot:'#8b3000', platEdge:'#ffe0b2', ground:['#3a2510','#251505','#150a02'], deco:'rgba(255,171,64,0.08)' }
];

function themeAt(x) {
  const idx = Math.floor(Math.max(0, x) / 3000) % THEMES.length;
  return THEMES[idx];
}

// ===== Состояние игры =====
let gameState = {
  voice: null, voiceKey: null,
  player: null,
  notes: [], collectibleNotes: [], particles: [], platforms: [], enemies: [],
  camera: { x: 0, y: 0 },
  charging: false, chargeValue: 0, chargeDirection: 1,
  lastNote: 'C3', score: 0, groundY: 0, time: 0,
  health: 3, invulnTimer: 0, deathTimer: 0,
  generatedUpToX: 0,
  lastPlatform: null,
  lastEnemyX: 0,
  // Эффекты арий
  effects: {
    frozen: 0,        // заморозка врагов
    invuln: 0,        // неуязвимость от арии
    shield: 0,        // щит (поглощает 1 удар)
    slow: 0,          // замедление времени
    doubleJump: 0,    // двойной прыжок
    rage: 0,          // ярость (x2 урон)
    jumpsLeft: 0      // счётчик прыжков
  },
  // Кулдауны арий
  ariaCooldowns: {},
  // Флаг паузы (меню арий)
  paused: false,
  // Активные эффекты для отображения
  activeEffects: []
};

// ===== Ввод =====
const keys = {};
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeAriaMenu();
    return;
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter' && gameState.voice && !gameState.charging && gameState.health > 0 && !gameState.paused) gameState.charging = true;
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (e.key === 'Enter' && gameState.charging && gameState.voice) {
    fireNote();
    gameState.charging = false;
  }
});

document.querySelectorAll('.voice-btn').forEach(btn => {
  btn.addEventListener('click', () => startGame(btn.dataset.voice));
});

// ===== КЛИК ПО ПЕРСОНАЖУ =====
canvas.addEventListener('click', (e) => {
  if (!gameState.player || gameState.health <= 0) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  // Проверяем клик по игроку (с учётом камеры)
  const p = gameState.player;
  const screenX = p.x - gameState.camera.x;
  const screenY = p.y;
  if (mx > screenX && mx < screenX + p.w && my > screenY && my < screenY + p.h) {
    openAriaMenu();
  }
});

// ===== МЕНЮ АРИЙ =====
const ariaMenuEl = document.getElementById('ariaMenu');
const ariaGridEl = document.getElementById('ariaGrid');
const ariaTitleEl = document.getElementById('ariaMenuTitle');
const ariaSubtitleEl = document.getElementById('ariaMenuSubtitle');

function openAriaMenu() {
  if (!gameState.voice) return;
  gameState.paused = true;
  ariaMenuEl.style.display = 'flex';
  renderAriaMenu();
}

function closeAriaMenu() {
  ariaMenuEl.style.display = 'none';
  gameState.paused = false;
}

ariaMenuEl.addEventListener('click', (e) => {
  if (e.target === ariaMenuEl) closeAriaMenu();
});

function renderAriaMenu() {
  const v = gameState.voice;
  const key = gameState.voiceKey;
  ariaTitleEl.textContent = '🎭 Арии — ' + v.name;
  ariaSubtitleEl.textContent = 'Ваши очки: 𝄞' + gameState.score + '  •  Кликните по арии для активации';

  ariaGridEl.innerHTML = '';
  const arias = ARIAS[key] || [];

  arias.forEach(aria => {
    const cd = gameState.ariaCooldowns[aria.id] || 0;
    const canAfford = gameState.score >= aria.cost;
    const onCooldown = cd > 0;
    const disabled = !canAfford || onCooldown;

    const card = document.createElement('div');
    card.className = 'aria-card' + (disabled ? ' disabled' : '');
    card.innerHTML = `
      <div class="aria-name">${aria.icon} ${aria.name}</div>
      <div class="aria-desc">${aria.desc}</div>
      <div class="aria-effect">Эффект: ${describeEffect(aria)}</div>
      <div class="aria-cost">
        <span>𝄞 ${aria.cost}</span>
        <span class="cd">${onCooldown ? '⏱ ' + cd.toFixed(1) + 'с' : (aria.cooldown ? 'КД ' + aria.cooldown + 'с' : '')}</span>
      </div>
    `;

    if (!disabled) {
      card.addEventListener('click', () => activateAria(aria));
    }

    ariaGridEl.appendChild(card);
  });
}

function describeEffect(aria) {
  switch (aria.effect) {
    case 'freeze': return 'Заморозка врагов (' + aria.duration + 'с)';
    case 'heal': return 'Восстановление здоровья';
    case 'volley': return 'Залп из 5 нот';
    case 'slow': return 'Замедление времени (' + aria.duration + 'с)';
    case 'invuln': return 'Неуязвимость (' + aria.duration + 'с)';
    case 'shield': return 'Щит (1 удар)';
    case 'explosion': return 'Взрыв всех врагов на экране';
    case 'killAll': return 'Уничтожение всех врагов';
    case 'doubleJump': return 'Двойной прыжок (' + aria.duration + 'с)';
    case 'magnet': return 'Притягивание нот';
    case 'push': return 'Отталкивание врагов';
    case 'rage': return 'Двойной урон (' + aria.duration + 'с)';
    default: return '';
  }
}

function activateAria(aria) {
  if (gameState.score < aria.cost) return;
  if ((gameState.ariaCooldowns[aria.id] || 0) > 0) return;

  gameState.score -= aria.cost;
  gameState.ariaCooldowns[aria.id] = aria.cooldown;
  applyAriaEffect(aria);
  closeAriaMenu();
}

function applyAriaEffect(aria) {
  const p = gameState.player;
  const fx = gameState.effects;

  switch (aria.effect) {
    case 'freeze':
      fx.frozen = aria.duration;
      addActiveEffect(aria.icon + ' Заморозка', aria.duration, aria.color);
      break;

    case 'heal':
      gameState.health = Math.min(5, gameState.health + 1);
      spawnTextParticles(p.x + p.w/2, p.y, '+1 ❤️', '#2ecc71');
      break;

    case 'volley':
      // Залп из 5 нот веером
      for (let i = 0; i < 5; i++) {
        const angle = -0.6 + i * 0.3;
        const dir = p.facing;
        const t = 0.5;
        const v = gameState.voice;
        const midi = v.minMidi + Math.round(t * (v.maxMidi - v.minMidi));
        gameState.notes.push({
          x: p.x + p.w / 2 + dir * 30,
          y: p.y + p.h * 0.4,
          vx: dir * (10 + t * 8) * Math.cos(angle),
          vy: -2 + Math.sin(angle) * 10,
          life: 1.0, maxLife: 1.0,
          color: v.colors.top,
          noteName: midiToName(midi),
          size: 22, rot: 0, rotSpeed: (Math.random() - 0.5) * 0.15,
          t, damage: v.damageBase * v.damageCurve(t) * 20 * 1.2
        });
      }
      spawnTextParticles(p.x + p.w/2, p.y, 'Vincerò!', '#ff8c00');
      break;

    case 'slow':
      fx.slow = aria.duration;
      addActiveEffect('⏳ Замедление', aria.duration, '#ba68c8');
      break;

    case 'invuln':
      fx.invuln = aria.duration;
      gameState.invulnTimer = Math.max(gameState.invulnTimer, aria.duration);
      addActiveEffect('🛡️ Неуязвимость', aria.duration, '#ffd700');
      break;

    case 'shield':
      fx.shield = 1;
      addActiveEffect('🔵 Щит', aria.duration, '#4fc3f7');
      break;

    case 'explosion':
      // Взрыв всех врагов на экране
      for (const enemy of gameState.enemies) {
        if (!enemy.alive) continue;
        if (enemy.x + enemy.w < gameState.camera.x - 100) continue;
        if (enemy.x > gameState.camera.x + W + 100) continue;
        enemy.hp -= 150;
        enemy.hitFlash = 0.4;
        for (let j = 0; j < 15; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 6;
          gameState.particles.push({
            x: enemy.x + enemy.w/2, y: enemy.y + enemy.h/2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.9, maxLife: 0.9, color: '#e74c3c', size: 3 + Math.random() * 5
          });
        }
        if (enemy.hp <= 0) {
          enemy.alive = false;
          enemy.hitFlash = 0.5;
          gameState.score += 100;
        }
      }
      spawnTextParticles(p.x + p.w/2, p.y, '💥 БУМ!', '#e74c3c');
      break;

    case 'killAll':
      for (const enemy of gameState.enemies) {
        if (!enemy.alive) continue;
        if (enemy.x + enemy.w < gameState.camera.x - 100) continue;
        if (enemy.x > gameState.camera.x + W + 100) continue;
        enemy.alive = false;
        enemy.hitFlash = 0.5;
        gameState.score += 100;
        for (let j = 0; j < 20; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 7;
          gameState.particles.push({
            x: enemy.x + enemy.w/2, y: enemy.y + enemy.h/2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 1.2, maxLife: 1.2, color: '#c0392b', size: 4 + Math.random() * 6
          });
        }
      }
      spawnTextParticles(p.x + p.w/2, p.y, '☠️ РЕКВИЕМ', '#c0392b');
      break;

    case 'doubleJump':
      fx.doubleJump = aria.duration;
      fx.jumpsLeft = 2;
      addActiveEffect('🦘 Двойной прыжок', aria.duration, '#ffd700');
      break;

    case 'magnet':
      // Притягиваем все ноты на экране
      for (const cn of gameState.collectibleNotes) {
        if (cn.collected) continue;
        if (cn.x < gameState.camera.x - 200) continue;
        if (cn.x > gameState.camera.x + W + 200) continue;
        // Даём им скорость к игроку
        cn.magnet = true;
      }
      spawnTextParticles(p.x + p.w/2, p.y, '🧲 Притяжение!', '#ff8c00');
      break;

    case 'push':
      // Отталкиваем врагов
      for (const enemy of gameState.enemies) {
        if (!enemy.alive) continue;
        const dx = (enemy.x + enemy.w/2) - (p.x + p.w/2);
        const dir = dx > 0 ? 1 : -1;
        enemy.vx = dir * 12;
        enemy.patrolMinX -= 200;
        enemy.patrolMaxX += 200;
      }
      spawnTextParticles(p.x + p.w/2, p.y, '💨 Отталкивание!', '#4fc3f7');
      break;

    case 'rage':
      fx.rage = aria.duration;
      addActiveEffect('⚔️ Ярость x2', aria.duration, '#e74c3c');
      break;
  }
}

function addActiveEffect(name, duration, color) {
  gameState.activeEffects.push({ name, time: duration, maxTime: duration, color });
}

function spawnTextParticles(x, y, text, color) {
  gameState.particles.push({
    x, y, vx: 0, vy: -2,
    life: 1.5, maxLife: 1.5,
    color, size: 5, text, isText: true, big: true
  });
}

// ===== ГЕОМЕТРИЯ =====
function rectsOverlap(a, b, pad = 0) {
  return !(a.x + a.w + pad <= b.x ||
           b.x + b.w + pad <= a.x ||
           a.y + a.h + pad <= b.y ||
           b.y + b.h + pad <= a.y);
}
// ===== ПРОЦЕДУРНАЯ ГЕНЕРАЦИЯ =====
const PLAT_MIN_W = 120, PLAT_MAX_W = 280;
const PLAT_H = 25;
const JUMP_H_REACH = 300;
const JUMP_UP_REACH = 100;
const JUMP_DOWN_REACH = 240;

function canReach(from, to) {
  const fromRight = from.x + from.w;
  const toRight = to.x + to.w;
  const gap = Math.max(0, Math.max(from.x - toRight, to.x - fromRight));
  if (gap > JUMP_H_REACH) return false;
  const dy = to.y - from.y;
  const horizRatio = gap / JUMP_H_REACH;
  const maxUp = JUMP_UP_REACH * (1 - horizRatio * 0.6);
  if (dy < -maxUp) return false;
  if (dy > JUMP_DOWN_REACH) return false;
  return true;
}
function generatePlatformsUpTo(targetX) {
  const groundY = gameState.groundY;
  const player = gameState.player;

  while (gameState.generatedUpToX < targetX) {
    const last = gameState.lastPlatform;
    let placed = false;
    let attempts = 0;

    while (!placed && attempts < 40) {
      attempts++;

      const w = PLAT_MIN_W + Math.random() * (PLAT_MAX_W - PLAT_MIN_W);

      const minGap = 70;
      const maxGap = 220;
      const x = last.x + last.w + minGap + Math.random() * (maxGap - minGap);

      const roll = Math.random();
      let dy;
      if (roll < 0.35)      dy = -(30 + Math.random() * 60);
      else if (roll < 0.60) dy =  (30 + Math.random() * 70);
      else                  dy =  (Math.random() - 0.5) * 50;

      let y = last.y + dy;

      const minY = groundY - 520;
      const maxY = groundY - 90;
      y = Math.max(minY, Math.min(maxY, y));

      const candidate = { x, y, w, h: PLAT_H, theme: themeAt(x) };

      if (!canReach(last, candidate)) continue;

      if (player && Math.abs(player.x - last.x) < 800) {
        const playerFeet = { x: player.x, y: player.y + player.h, w: player.w, h: 1 };
        if (!canReach(playerFeet, candidate)) continue;
      }

      let overlaps = false;
      for (const p of gameState.platforms) {
        if (p.isGround) continue;
        if (rectsOverlap(candidate, p, 30)) { overlaps = true; break; }
      }
      if (overlaps) continue;

      if (player) {
        const dx = Math.abs((candidate.x + candidate.w / 2) - (player.x + player.w / 2));
        if (dx < 150 && candidate.y < player.y - JUMP_UP_REACH) continue;
      }

      gameState.platforms.push(candidate);
      gameState.lastPlatform = candidate;
      gameState.generatedUpToX = candidate.x + candidate.w;

      const difficulty = Math.min(1, candidate.x / 8000);
      const enemyChance = 0.12 + difficulty * 0.35;
      if (candidate.w > 150 && Math.random() < enemyChance && candidate.x - gameState.lastEnemyX > 550) {
        const ew = 44, eh = 60;
        const ex = candidate.x + 20 + Math.random() * (candidate.w - ew - 40);
        const ey = candidate.y - eh;
        const hp = 80 + difficulty * 100;
        gameState.enemies.push({
          x: ex, y: ey,
          vx: (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 1.3 + difficulty * 0.8),
          vy: 0, w: ew, h: eh, alive: true, hitFlash: 0,
          hp, maxHp: hp,
          patrolMinX: candidate.x + 8, patrolMaxX: candidate.x + candidate.w - ew - 8,
          wobble: Math.random() * Math.PI * 2
        });
        gameState.lastEnemyX = candidate.x;
      }

      if (Math.random() < 0.6) {
        gameState.collectibleNotes.push({
          x: candidate.x + candidate.w / 2,
          y: candidate.y - 35,
          type: Math.random() < 0.7 ? 'single' : 'double',
          collected: false, bob: Math.random() * Math.PI * 2
        });
      }

      placed = true;
    }

    if (!placed) {
      const x = last.x + last.w + 100;
      const y = Math.max(groundY - 520, Math.min(groundY - 90, last.y - 50 + Math.random() * 100));
      const candidate = { x, y, w: 180, h: PLAT_H, theme: themeAt(x) };
      gameState.platforms.push(candidate);
      gameState.lastPlatform = candidate;
      gameState.generatedUpToX = candidate.x + candidate.w;
    }
  }
}

function cullBehind(playerX) {
  const cullX = playerX - 6000;
  gameState.platforms = gameState.platforms.filter(p => {
    if (p.isGround) {
      return p.x + p.w > cullX - 4000;
    }
    return p.x + p.w > cullX;
  });
  gameState.enemies = gameState.enemies.filter(e => e.x + e.w > cullX);
  gameState.collectibleNotes = gameState.collectibleNotes.filter(c => c.x > cullX && !c.collected);

  if (gameState.lastPlatform && gameState.lastPlatform.x + gameState.lastPlatform.w < cullX) {
    let best = null;
    for (const p of gameState.platforms) {
      if (p.isGround) continue;
      if (!best || p.x > best.x) best = p;
    }
    if (best) gameState.lastPlatform = best;
  }
}

// ===== Старт игры =====
function startGame(voiceKey) {
  gameState.voice = VOICE_TYPES[voiceKey];
  gameState.voiceKey = voiceKey;
  gameState.enemies = [];
  gameState.health = 3;
  gameState.invulnTimer = 0;
  gameState.deathTimer = 0;
  gameState.score = 0;

  document.getElementById('menu').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('voiceInfo').textContent = gameState.voice.name + ' — ' + gameState.voice.damageDesc;

  gameState.groundY = H - 80;
  gameState.platforms = [];

  for (let i = 0; i < 400; i++) {
    gameState.platforms.push({ x: i * 400, y: gameState.groundY, w: 400, h: 200, isGround: true });
  }

  const startPlat = { x: 260, y: gameState.groundY - 140, w: 200, h: PLAT_H, theme: themeAt(260) };
  gameState.platforms.push(startPlat);
  gameState.lastPlatform = startPlat;
  gameState.generatedUpToX = startPlat.x + startPlat.w;
  gameState.lastEnemyX = 0;

  gameState.player = {
    x: 100, y: gameState.groundY - 120,
    vx: 0, vy: 0, w: 50, h: 120,
    onGround: false, facing: 1, voiceKey: voiceKey
  };

  gameState.chargeValue = 0;
  gameState.chargeDirection = 1;
  gameState.notes = [];
  gameState.particles = [];
  gameState.time = 0;
  gameState.camera.x = 0;
  gameState.collectibleNotes = [];
  gameState.activeEffects = [];
  gameState.effects = { frozen:0, invuln:0, shield:0, slow:0, doubleJump:0, rage:0, jumpsLeft:0 };
  gameState.ariaCooldowns = {};
  gameState.paused = false;

  for (let i = 0; i < 8; i++) {
    gameState.collectibleNotes.push({
      x: 500 + i * 600 + Math.random() * 200,
      y: gameState.groundY - 40,
      type: Math.random() < 0.6 ? 'single' : 'double',
      collected: false, bob: Math.random() * Math.PI * 2
    });
  }

  generatePlatformsUpTo(3000);

  requestAnimationFrame(gameLoop);
}

// ===== Стрельба =====
function fireNote() {
  const v = gameState.voice;
  const range = v.maxMidi - v.minMidi;
  const midi = v.minMidi + Math.round(gameState.chargeValue * range);
  const noteName = midiToName(midi);
  const p = gameState.player;
  const dir = p.facing;
  const t = gameState.chargeValue;
  let color;
  if (t < 0.5) color = lerpColor(v.colors.low, v.colors.mid, t * 2);
  else         color = lerpColor(v.colors.mid, v.colors.top, (t - 0.5) * 2);

  let damage = v.damageBase * v.damageCurve(t) * 20;
  if (gameState.effects.rage > 0) damage *= 2;

  gameState.notes.push({
    x: p.x + p.w / 2 + dir * 30, y: p.y + p.h * 0.4,
    vx: dir * (8 + t * 8), vy: -2 - t * 3,
    life: 1.0, maxLife: 1.0, color, noteName,
    size: 20 + t * 25, rot: 0, rotSpeed: (Math.random() - 0.5) * 0.1,
    t, damage
  });

  for (let i = 0; i < 8; i++) {
    gameState.particles.push({
      x: p.x + p.w / 2 + dir * 30, y: p.y + p.h * 0.4,
      vx: dir * (2 + Math.random() * 5), vy: (Math.random() - 0.5) * 6,
      life: 0.6, maxLife: 0.6, color, size: 3 + Math.random() * 4
    });
  }

  gameState.score++;
  gameState.chargeValue = 0;
  gameState.chargeDirection = 1;
}

function lerpColor(a, b, t) {
  const ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  const br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  return `rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}

// ===== Рисование певца =====
function drawSinger(p, singing, chargeT) {
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  const dir = p.facing;

  if (gameState.invulnTimer > 0 && Math.floor(gameState.invulnTimer * 10) % 2 === 0) {
    ctx.globalAlpha = 0.4;
  }

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(dir, 1);
  ctx.translate(-p.w / 2, -p.h / 2);

  const headBob = singing ? Math.sin(gameState.time * 20) * 2 : 0;
  const breathe = Math.sin(gameState.time * 2) * 1;

  switch (p.voiceKey) {
    case 'tenor':    drawTenor(p, singing, chargeT, headBob, breathe); break;
    case 'bass':     drawBass(p, singing, chargeT, headBob, breathe); break;
    case 'baritone': drawBaritone(p, singing, chargeT, headBob, breathe); break;
  }

  if (singing) {
    const noteCount = 3;
    for (let i = 0; i < noteCount; i++) {
      const t = gameState.time * 3 + i * 2;
      const nx = 25 + Math.cos(t) * (25 + chargeT * 15);
      const ny = 20 + Math.sin(t * 1.3) * 15 - 20 - chargeT * 10;
      const alpha = 0.5 + Math.sin(t) * 0.5;
      ctx.globalAlpha = alpha * 0.8;
      drawNoteSymbol(ctx, nx, ny, 8 + chargeT * 6, gameState.voice ? gameState.voice.colors.top : '#ffd700');
      ctx.globalAlpha = 1;
    }
  }

  // Индикатор щита
  if (gameState.effects.shield > 0) {
    ctx.strokeStyle = 'rgba(79, 195, 247, 0.8)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(25, 60, 45, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawNoteSymbol(ctx, x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, size / 8);
  ctx.beginPath();
  ctx.ellipse(x, y + size * 0.3, size * 0.35, size * 0.28, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + size * 0.3, y + size * 0.25);
  ctx.lineTo(x + size * 0.3, y - size * 0.7);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + size * 0.3, y - size * 0.7);
  ctx.quadraticCurveTo(x + size * 0.7, y - size * 0.4, x + size * 0.3, y - size * 0.1);
  ctx.stroke();
  ctx.restore();
}

// ===== Физика и логика =====
const GRAVITY = 0.8;
const MOVE_SPEED = 6;
const JUMP_POWER = -16;

function update(dt) {
  if (gameState.paused) return; // Пауза при открытом меню арий

  // Замедление времени
  const timeScale = gameState.effects.slow > 0 ? 0.4 : 1;
  const effectiveDt = dt * timeScale;

  gameState.time += effectiveDt;
  const p = gameState.player;
  if (!p) return;

  // Горизонтальное движение
  if (keys['arrowleft'] || keys['a'] || keys['ф']) {
    p.vx = -MOVE_SPEED; p.facing = -1;
  } else if (keys['arrowright'] || keys['d'] || keys['в']) {
    p.vx = MOVE_SPEED; p.facing = 1;
  } else {
    p.vx *= 0.8;
    if (Math.abs(p.vx) < 0.1) p.vx = 0;
  }

  // Прыжок
  const jumpPressed = keys[' '] || keys['arrowup'] || keys['w'] || keys['ц'];
  if (jumpPressed && p.onGround) {
    p.vy = JUMP_POWER;
    p.onGround = false;
    gameState.effects.jumpsLeft = gameState.effects.doubleJump > 0 ? 1 : 0;
  } else if (jumpPressed && !p.onGround && gameState.effects.doubleJump > 0 && gameState.effects.jumpsLeft > 0) {
    // Двойной прыжок
    if (!p._jumpHeld) {
      p.vy = JUMP_POWER * 0.85;
      gameState.effects.jumpsLeft--;
      p._jumpHeld = true;
      for (let i = 0; i < 8; i++) {
        gameState.particles.push({
          x: p.x + p.w/2, y: p.y + p.h,
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3,
          life: 0.5, maxLife: 0.5, color: '#ffd700', size: 3 + Math.random() * 3
        });
      }
    }
  }
  if (!jumpPressed) p._jumpHeld = false;

  p.vy += GRAVITY * timeScale;
  p.x += p.vx * timeScale;
  p.y += p.vy * timeScale;

  // Коллизии с платформами
  p.onGround = false;
  for (const plat of gameState.platforms) {
    if (p.x + p.w > plat.x && p.x < plat.x + plat.w) {
      if (p.vy >= 0 && p.y + p.h > plat.y && p.y + p.h - p.vy <= plat.y + 12) {
        p.y = plat.y - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }
  }

  if (p.x < 0) p.x = 0;

  // Камера
  const targetCamX = p.x + p.w / 2 - W / 3;
  gameState.camera.x += (targetCamX - gameState.camera.x) * 0.1;
  if (gameState.camera.x < 0) gameState.camera.x = 0;

  // Процедурная генерация впереди
  generatePlatformsUpTo(p.x + W + 1500);
  cullBehind(p.x);

  // Набор высоты
  if (gameState.charging) {
    gameState.chargeValue += gameState.chargeDirection * 0.012;
    if (gameState.chargeValue >= 1) { gameState.chargeValue = 1; gameState.chargeDirection = -1; }
    else if (gameState.chargeValue <= 0) { gameState.chargeValue = 0; gameState.chargeDirection = 1; }

    const v = gameState.voice;
    const midi = v.minMidi + Math.round(gameState.chargeValue * (v.maxMidi - v.minMidi));
    gameState.lastNote = midiToName(midi);

    if (Math.random() < 0.3) {
      const col = gameState.chargeValue < 0.5
        ? lerpColor(v.colors.low, v.colors.mid, gameState.chargeValue * 2)
        : lerpColor(v.colors.mid, v.colors.top, (gameState.chargeValue - 0.5) * 2);
      gameState.particles.push({
        x: p.x + p.w / 2 + (Math.random() - 0.5) * 40,
        y: p.y + 20,
        vx: (Math.random() - 0.5) * 2,
        vy: -1 - Math.random() * 2,
        life: 0.8, maxLife: 0.8, color: col, size: 2 + Math.random() * 3
      });
    }
  }

  // Собираемые ноты
  for (let i = gameState.collectibleNotes.length - 1; i >= 0; i--) {
    const cn = gameState.collectibleNotes[i];
    if (cn.collected) continue;
    cn.bob += 0.06;

    // Притяжение (эффект магнита)
    if (cn.magnet) {
      const dx = (p.x + p.w/2) - cn.x;
      const dy = (p.y + p.h/2) - cn.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist > 5) {
        cn.x += (dx / dist) * 12 * timeScale;
        cn.y += (dy / dist) * 12 * timeScale;
      }
    }

    if (p.x + p.w > cn.x - 15 && p.x < cn.x + 15 &&
        p.y + p.h > cn.y - 15 && p.y < cn.y + 15) {
      cn.collected = true;
      const value = cn.type === 'single' ? 1 : 5;
      gameState.score += value;

      gameState.particles.push({
        x: cn.x, y: cn.y - 10, vx: 0, vy: -1.5,
        life: 1.0, maxLife: 1.0,
        color: cn.type === 'single' ? '#ffd700' : '#ff8c00',
        size: 4, text: '+' + value, isText: true
      });

      for (let j = 0; j < 10; j++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1 + Math.random() * 4;
        gameState.particles.push({
          x: cn.x, y: cn.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
          life: 0.7, maxLife: 0.7,
          color: cn.type === 'single' ? '#ffd700' : '#ff8c00',
          size: 2 + Math.random() * 3
        });
      }

      gameState.collectibleNotes.splice(i, 1);
    }
  }

  // Ноты-снаряды
  for (let i = gameState.notes.length - 1; i >= 0; i--) {
    const n = gameState.notes[i];
    n.x += n.vx * timeScale;
    n.y += n.vy * timeScale;
    n.vy += 0.15 * timeScale;
    n.rot += n.rotSpeed * timeScale;
    n.vx *= 0.995;
    n.life -= 0.004 * timeScale;

    let hit = false;
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (n.x + n.size * 0.5 > enemy.x &&
          n.x - n.size * 0.5 < enemy.x + enemy.w &&
          n.y + n.size * 0.5 > enemy.y &&
          n.y - n.size * 0.5 < enemy.y + enemy.h) {

        enemy.hp -= n.damage;
        enemy.hitFlash = 0.3;

        gameState.particles.push({
          x: n.x, y: n.y,
          vx: (Math.random() - 0.5) * 2, vy: -2,
          life: 0.8, maxLife: 0.8, color: '#fff',
          size: 4, text: Math.round(n.damage), isText: true
        });

        for (let j = 0; j < 12; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 5;
          gameState.particles.push({
            x: enemy.x + enemy.w / 2, y: enemy.y + enemy.h / 2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.9, maxLife: 0.9, color: n.color, size: 3 + Math.random() * 4
          });
        }

        if (enemy.hp <= 0) {
          enemy.alive = false;
          enemy.hitFlash = 0.5;
          gameState.score += 100;
          for (let j = 0; j < 15; j++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 3 + Math.random() * 6;
            gameState.particles.push({
              x: enemy.x + enemy.w / 2, y: enemy.y + enemy.h / 2,
              vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
              life: 1.0, maxLife: 1.0, color: '#ffd700', size: 4 + Math.random() * 5
            });
          }
        }

        hit = true;
        break;
      }
    }

    if (hit || n.life <= 0 || n.x < gameState.camera.x - 200 || n.x > gameState.camera.x + W + 400) {
      gameState.notes.splice(i, 1);
    }
  }

  // Враги
  for (const enemy of gameState.enemies) {
    if (!enemy.alive) {
      if (enemy.hitFlash > 0) enemy.hitFlash -= effectiveDt;
      continue;
    }

    // Заморозка
    if (gameState.effects.frozen > 0) {
      // Враги не двигаются
    } else {
      enemy.x += enemy.vx * timeScale;
    }
    enemy.wobble += 0.1 * timeScale;

    if (enemy.x < enemy.patrolMinX) { enemy.x = enemy.patrolMinX; if (gameState.effects.frozen <= 0) enemy.vx *= -1; }
    if (enemy.x + enemy.w > enemy.patrolMaxX) { enemy.x = enemy.patrolMaxX - enemy.w; if (gameState.effects.frozen <= 0) enemy.vx *= -1; }
  }

  // Неуязвимость
  if (gameState.invulnTimer > 0) gameState.invulnTimer -= effectiveDt;

  // Столкновение с врагами
  if (gameState.invulnTimer <= 0 && gameState.health > 0) {
    for (const enemy of gameState.enemies) {
      if (!enemy.alive) continue;
      if (p.x + p.w > enemy.x &&
          p.x < enemy.x + enemy.w &&
          p.y + p.h > enemy.y &&
          p.y < enemy.y + enemy.h) {

        // Проверяем щит
        if (gameState.effects.shield > 0) {
          gameState.effects.shield = 0;
          gameState.invulnTimer = 1.0;
          spawnTextParticles(p.x + p.w/2, p.y, '🛡️ Щит!', '#4fc3f7');
          // Отталкиваем врага
          const dir = (p.x + p.w/2 < enemy.x + enemy.w/2) ? -1 : 1;
          enemy.vx = dir * 8;
          p.vx = -dir * 6;
          p.vy = -6;
          continue;
        }

        gameState.health--;
        gameState.invulnTimer = 1.5;

        p.vx = (p.x + p.w/2 < enemy.x + enemy.w/2 ? -1 : 1) * 10;
        p.vy = -8;

        for (let j = 0; j < 20; j++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 3 + Math.random() * 6;
          gameState.particles.push({
            x: p.x + p.w / 2, y: p.y + p.h / 2,
            vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 2,
            life: 0.8, maxLife: 0.8, color: '#ff3030', size: 3 + Math.random() * 4
          });
        }

        if (gameState.health <= 0) gameState.deathTimer = 2;
        break;
      }
    }
  }

  // Смерть и возрождение
  if (gameState.deathTimer > 0) {
    gameState.deathTimer -= effectiveDt;
    if (gameState.deathTimer <= 0) {
      gameState.health = 3;
      p.x = gameState.camera.x + 100;
      p.y = gameState.groundY - p.h - 200;
      p.vx = 0; p.vy = 0;
      gameState.invulnTimer = 2;
    }
  }

  // Частицы
  for (let i = gameState.particles.length - 1; i >= 0; i--) {
    const pt = gameState.particles[i];
    pt.x += pt.vx * timeScale;
    pt.y += pt.vy * timeScale;
    if (!pt.isText) pt.vy += 0.08 * timeScale;
    pt.life -= effectiveDt;
    if (pt.life <= 0) gameState.particles.splice(i, 1);
  }

  // Обновление эффектов и кулдаунов
  updateEffects(effectiveDt);
  updateCooldowns(effectiveDt);

  // HUD
  document.getElementById('noteDisplay').textContent = gameState.lastNote;
  document.getElementById('noteDisplay').style.color = gameState.charging
    ? (gameState.chargeValue < 0.5
        ? lerpColor(gameState.voice.colors.low, gameState.voice.colors.mid, gameState.chargeValue * 2)
        : lerpColor(gameState.voice.colors.mid, gameState.voice.colors.top, (gameState.chargeValue - 0.5) * 2))
    : '#ffd700';
  document.getElementById('barFill').style.width = (gameState.chargeValue * 100) + '%';
  document.getElementById('health').innerHTML = '❤️'.repeat(Math.max(0, gameState.health));
  document.getElementById('score').textContent = '𝄞' + gameState.score;
}

function updateEffects(dt) {
  const fx = gameState.effects;
  if (fx.frozen > 0) fx.frozen -= dt;
  if (fx.invuln > 0) fx.invuln -= dt;
  if (fx.slow > 0) fx.slow -= dt;
  if (fx.doubleJump > 0) fx.doubleJump -= dt;
  if (fx.rage > 0) fx.rage -= dt;

  // Обновляем визуальные индикаторы
  for (let i = gameState.activeEffects.length - 1; i >= 0; i--) {
    gameState.activeEffects[i].time -= dt;
    if (gameState.activeEffects[i].time <= 0) {
      gameState.activeEffects.splice(i, 1);
    }
  }
  renderEffectBadges();
}

function renderEffectBadges() {
  const el = document.getElementById('effects');
  el.innerHTML = '';
  for (const eff of gameState.activeEffects) {
    const badge = document.createElement('div');
    badge.className = 'effect-badge';
    badge.style.borderColor = eff.color;
    badge.style.color = eff.color;
    badge.textContent = eff.name + ' ' + Math.ceil(eff.time) + 'с';
    el.appendChild(badge);
  }
}

function updateCooldowns(dt) {
  for (const key in gameState.ariaCooldowns) {
    if (gameState.ariaCooldowns[key] > 0) {
      gameState.ariaCooldowns[key] -= dt;
      if (gameState.ariaCooldowns[key] < 0) gameState.ariaCooldowns[key] = 0;
    }
  }
}

// ===== Рендер =====
function render() {
  const camX = gameState.camera.x;
  const theme = themeAt(camX + W / 2);

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, theme.bg[0]);
  grad.addColorStop(0.5, theme.bg[1]);
  grad.addColorStop(1, theme.bg[2]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Эффект заморозки — синий оттенок
  if (gameState.effects.frozen > 0) {
    ctx.fillStyle = 'rgba(79, 195, 247, 0.12)';
    ctx.fillRect(0, 0, W, H);
  }
  // Эффект ярости — красный оттенок
  if (gameState.effects.rage > 0) {
    ctx.fillStyle = 'rgba(231, 76, 60, 0.08)';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.save();
  ctx.translate(-camX * 0.3, 0);
  const startTile = Math.floor((camX * 0.3 - 200) / 600);
  const endTile = Math.ceil((camX * 0.3 + W + 200) / 600);
  for (let i = startTile; i <= endTile; i++) {
    const x = i * 600 + 100;
    ctx.fillStyle = theme.deco;
    ctx.fillRect(x, 100, 80, H - 200);
    ctx.fillStyle = theme.platEdge;
    ctx.globalAlpha = 0.05;
    ctx.fillRect(x + 10, 100, 60, H - 200);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.save();
  const spotX = W / 2;
  const spotGrad = ctx.createRadialGradient(spotX, -100, 50, spotX, H * 0.6, H);
  spotGrad.addColorStop(0, 'rgba(255, 240, 200, 0.15)');
  spotGrad.addColorStop(1, 'rgba(255, 240, 200, 0)');
  ctx.fillStyle = spotGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  ctx.save();
  ctx.translate(-camX, 0);
  for (const plat of gameState.platforms) {
    if (plat.x + plat.w < camX - 100) continue;
    if (plat.x > camX + W + 100) continue;

    const t = plat.theme || theme;

    if (plat.isGround) {
      const g2 = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
      g2.addColorStop(0, t.ground[0]);
      g2.addColorStop(0.1, t.ground[1]);
      g2.addColorStop(1, t.ground[2]);
      ctx.fillStyle = g2;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < plat.w; i += 60) {
        ctx.beginPath();
        ctx.moveTo(plat.x + i, plat.y);
        ctx.lineTo(plat.x + i, plat.y + plat.h);
        ctx.stroke();
      }
      ctx.strokeStyle = t.platEdge;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(plat.x, plat.y);
      ctx.lineTo(plat.x + plat.w, plat.y);
      ctx.stroke();
    } else {
      const g3 = ctx.createLinearGradient(0, plat.y, 0, plat.y + plat.h);
      g3.addColorStop(0, t.platTop);
      g3.addColorStop(0.5, t.platMid);
      g3.addColorStop(1, t.platBot);
      ctx.fillStyle = g3;
      ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
      ctx.strokeStyle = t.platEdge;
      ctx.lineWidth = 2;
      ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);

      ctx.fillStyle = 'rgba(255, 248, 220, 0.35)';
      for (let i = 10; i < plat.w - 10; i += 25) {
        ctx.beginPath();
        ctx.arc(plat.x + i, plat.y + plat.h / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Собираемые ноты
  for (const cn of gameState.collectibleNotes) {
    if (cn.collected) continue;
    if (cn.x < camX - 100 || cn.x > camX + W + 100) continue;
    const bobY = Math.sin(cn.bob) * 5;
    const color = cn.type === 'single' ? '#ffd700' : '#ff8c00';

    ctx.save();
    ctx.shadowBlur = 15;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    ctx.font = cn.type === 'single' ? 'bold 28px Georgia' : 'bold 34px Georgia';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(cn.type === 'single' ? '♪' : '♫', cn.x, cn.y + bobY);
    ctx.restore();
  }

  // Летящие ноты
  for (const n of gameState.notes) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, n.life * 1.5);
    ctx.translate(n.x, n.y);
    ctx.rotate(n.rot);

    ctx.shadowBlur = 20;
    ctx.shadowColor = n.color;

    ctx.fillStyle = n.color;
    ctx.beginPath();
    ctx.ellipse(0, n.size * 0.2, n.size * 0.4, n.size * 0.3, -0.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = n.color;
    ctx.lineWidth = Math.max(2, n.size / 6);
    ctx.beginPath();
    ctx.moveTo(n.size * 0.32, n.size * 0.15);
    ctx.lineTo(n.size * 0.32, -n.size * 0.8);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(n.size * 0.32, -n.size * 0.8);
    ctx.quadraticCurveTo(n.size * 0.8, -n.size * 0.5, n.size * 0.32, -n.size * 0.15);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(10, n.size * 0.5)}px Georgia`;
    ctx.textAlign = 'center';
    ctx.fillText(n.noteName, 0, -n.size * 1.1);

    ctx.restore();
  }

  // Частицы
  for (const pt of gameState.particles) {
    ctx.save();
    ctx.globalAlpha = pt.life / pt.maxLife;
    if (pt.isText) {
      ctx.fillStyle = pt.color;
      ctx.font = (pt.big ? 'bold 32px' : 'bold 18px') + ' Georgia';
      ctx.textAlign = 'center';
      ctx.fillText(pt.text, pt.x, pt.y);
    } else {
      ctx.fillStyle = pt.color;
      ctx.shadowBlur = 10;
      ctx.shadowColor = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Враги
  for (const enemy of gameState.enemies) {
    if (enemy.x + enemy.w < camX - 100) continue;
    if (enemy.x > camX + W + 100) continue;

    if (!enemy.alive) {
      if (enemy.hitFlash > 0) {
        ctx.save();
        ctx.globalAlpha = enemy.hitFlash / 0.5;
        drawCritic(enemy, true);
        ctx.restore();
      }
      continue;
    }

    // Заморозка — рисуем с синим оттенком
    if (gameState.effects.frozen > 0) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      drawCritic(enemy, false);
      ctx.restore();
      ctx.save();
      ctx.fillStyle = 'rgba(79, 195, 247, 0.35)';
      ctx.beginPath();
      ctx.arc(enemy.x + enemy.w/2, enemy.y + enemy.h/2, enemy.w * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      drawCritic(enemy, false);
    }

    if (enemy.hp < enemy.maxHp) {
      const barW = enemy.w, barH = 6;
      const barX = enemy.x, barY = enemy.y - 14;
      const hpRatio = Math.max(0, enemy.hp / enemy.maxHp);

      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(barX, barY, barW, barH);

      let hpColor = '#e74c3c';
      if (hpRatio > 0.6) hpColor = '#2ecc71';
      else if (hpRatio > 0.3) hpColor = '#f39c12';

      ctx.fillStyle = hpColor;
      ctx.fillRect(barX, barY, barW * hpRatio, barH);
    }
  }

  // Игрок
  if (gameState.player) {
    drawSinger(gameState.player, gameState.charging, gameState.chargeValue);
  }

  ctx.restore();

  // Виньетка
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  // Индикатор темы
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#fff';
  ctx.font = '16px Georgia';
  ctx.textAlign = 'right';
  ctx.fillText('🎭 ' + theme.name, W - 20, 30);
  ctx.fillText('📍 ' + Math.floor(gameState.player.x) + ' px', W - 20, 54);

  // Подсказка про клик
  if (!gameState.paused && gameState.health > 0) {
    ctx.globalAlpha = 0.4 + Math.sin(gameState.time * 2) * 0.2;
    ctx.font = '14px Georgia';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd700';
    ctx.fillText('👆 Кликните по певцу для выбора арии', W / 2, H - 25);
  }
  ctx.restore();

  // Индикатор паузы
  if (gameState.paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
  }
}

// ===== ВРАГ — Критик =====
function drawCritic(enemy, dying) {
  const cx = enemy.x + enemy.w / 2;
  const cy = enemy.y + enemy.h / 2;
  const wobble = Math.sin(enemy.wobble) * 2;

  ctx.save();
  ctx.translate(cx, cy);

  if (dying) {
    ctx.scale(1 + (1 - enemy.hitFlash / 0.5) * 0.5, 1 + (1 - enemy.hitFlash / 0.5) * 0.5);
  }

  ctx.fillStyle = '#3a3a4a';
  ctx.beginPath();
  ctx.moveTo(-14, -20); ctx.lineTo(14, -20); ctx.lineTo(16, 25); ctx.lineTo(-16, 25);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#ddd';
  ctx.beginPath();
  ctx.moveTo(-8, -20); ctx.lineTo(8, -20); ctx.lineTo(6, 10); ctx.lineTo(-6, 10);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#8b0000';
  ctx.beginPath();
  ctx.moveTo(-3, -18); ctx.lineTo(3, -18); ctx.lineTo(4, 5); ctx.lineTo(0, 10); ctx.lineTo(-4, 5);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#2a2a2a';
  ctx.fillRect(-12, 25, 8, 8);
  ctx.fillRect(4, 25, 8, 8);

  ctx.fillStyle = '#d4a88a';
  ctx.beginPath(); ctx.arc(0, -30 + wobble, 13, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(0, -34 + wobble, 13, Math.PI, 0); ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-7, -32 + wobble); ctx.lineTo(-3, -30 + wobble); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, -32 + wobble); ctx.lineTo(3, -30 + wobble); ctx.stroke();

  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-5, -28 + wobble, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(5, -28 + wobble, 1.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-4, -22 + wobble);
  ctx.quadraticCurveTo(0, -25 + wobble, 4, -22 + wobble);
  ctx.stroke();

  ctx.fillStyle = '#f4e4c0';
  ctx.fillRect(16, -10, 10, 14);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1;
  ctx.strokeRect(16, -10, 10, 14);
  ctx.beginPath();
  ctx.moveTo(17, -6); ctx.lineTo(25, -6);
  ctx.moveTo(17, -3); ctx.lineTo(25, -3);
  ctx.moveTo(17, 0);  ctx.lineTo(22, 0);
  ctx.stroke();

  ctx.fillStyle = '#c0392b';
  ctx.fillRect(10, -38 + wobble, 2, 8);

  ctx.restore();
}

// ===== Игровой цикл =====
function gameLoop() {
  if (!gameState.voice) return;
  update(1/60);
  render();
  requestAnimationFrame(gameLoop);
}
</script>
